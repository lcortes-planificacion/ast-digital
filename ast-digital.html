car trayectoria de caída de material cortado. Mantener manos fuera de puntos de atrapamiento. Utilizar herramientas adecuadas para manipular piezas calientes."]]},{"etapa":"Término del corte y apagado del equipo","riesgos":[["Fuga de gases, retroceso de llama, quemaduras, incendio.","Apagar el soplete, Cerrar válvulas de los cilindros. Liberar presión de las líneas cuando corresponda. Verificar que no existan fugas ni fuentes de ignición remanentes."]]}]},{"ref":"aseo"},{"n":9,"etapas":[{"etapa":"Inspección del área de trabajo","riesgos":[["Caída a distinto nivel, golpes, contacto con obstáculos, caída de objetos.","Inspeccionar el área antes de comenzar; identificar bordes, desniveles, aberturas y obstáculos; delimitar y señalizar el área inferior."]]},{"etapa":"Inspección de equipos y sistema anticaídas","riesgos":[["Falla del equipo, caída de altura por uso de elementos defectuosos","Inspeccionar arnés, líneas de vida, conectores, absorbedores y puntos de anclaje antes de cada uso; retirar inmediatamente equipos dañados; verificar compatibilidad y certificación de los sistemas."]]},{"etapa":"Instalación de sistema de protección contra caídas","riesgos":[["Caída durante la instalación, golpes, atrapamiento.","Utilizar sistemas de protección adecuados; instalar puntos de anclaje y líneas de vida según especificaciones; mantener conexión al sistema anticaídas cuando exista exposición a caída."]]},{"etapa":"Ejecución del trabajo en altura","riesgos":[["Caída de trabajador, caída de herramientas/materiales, golpes y atrapamientos.","Utilizar arnés de cuerpo completo y sistema anticaídas apropiado; permanecer conectado a un punto de anclaje seguro; mantener superficie de trabajo estable; utilizar porta herramientas y asegurar elementos que puedan caer."]]},{"etapa":"Manipulación de herramientas y materiales","riesgos":[["Caída de objetos, golpes a trabajadores ubicados en niveles inferiores, sobreesfuerzo.","Amarrar herramientas cuando exista riesgo de caída; utilizar sistemas de izaje para materiales; prohibir el lanzamiento de objetos; mantener el área inferior segregada."]]},{"etapa":"Trabajo con escaleras","riesgos":[["Caída, volcamiento, deslizamiento, sobrealcance.","Utilizar escaleras en buen estado; instalar sobre superficie firme y estable; asegurar cuando corresponda; mantener tres puntos de apoyo; no trabajar desde peldaños no autorizados ni realizar sobrealcances."]]},{"etapa":"Trabajo sobre andamios/plataformas","riesgos":[["Caída desde plataforma, volcamiento, caída de objetos.","Utilizar andamios/plataformas correctamente instalados e inspeccionados; contar con barandas y rodapiés cuando corresponda; mantener acceso seguro; no modificar estructuras sin autorización."]]},{"etapa":"Descenso y término de la actividad","riesgos":[["Caída durante el descenso, caída de herramientas, golpes.","Mantener el sistema de protección contra caídas hasta encontrarse en zona segura; retirar materiales de forma controlada; bajar herramientas mediante sistemas adecuados; realizar inspección final del área."]]}]}]},"ms_torno":{"titulo":"Análisis Seguro de Trabajo (AST) Torno Convencional","bloques":[{"ref":"plan"},{"n":2,"etapas":[{"etapa":"Torno convencional, Inspección de la máquina","riesgos":[["Golpes, atrapamiento, contacto eléctrico","Revisar estado general, protecciones, cables, botonera y parada de emergencia antes de operar."]]},{"etapa":"Preparación y montaje de la pieza","riesgos":[["Golpes, cortes, atrapamiento, caída de la pieza","Realizar el montaje con la máquina detenida. Asegurar correctamente la pieza y retirar la llave del plato antes de poner en marcha."]]},{"etapa":"Montaje de herramienta","riesgos":[["Cortes, golpes, atrapamiento","Utilizar herramientas adecuadas y en buen estado. Realizar el montaje con la máquina detenida."]]},{"etapa":"Puesta en marcha","riesgos":[["Atrapamiento, golpes, proyección de piezas","Verificar que la pieza y herramienta estén correctamente sujetas. Mantener protecciones instaladas y utilizar ropa ajustada."]]}]},{"ref":"aseo"},{"ref":"izaje"},{"ref":"grua"}]},"ms_fresadora":{"titulo":"Análisis Seguro de Trabajo (AST) Fresadora","bloques":[{"ref":"plan"},{"n":2,"etapas":[{"etapa":"Fresadora Convencional (Inspección de la máquina)","riesgos":[["Golpes, atrapamiento, contacto eléctrico","Revisar cables, protecciones, botonera y parada de emergencia."]]},{"etapa":"Montaje y sujeción de pieza","riesgos":[["Golpes, atrapamiento, proyección o caída de pieza","Sujetar firmemente la pieza utilizando mordaza, bridas u otro sistema apropiado."]]}]},{"ref":"izaje"},{"ref":"aseo"},{"ref":"grua"}]},"ms_taladro":{"titulo":"Análisis Seguro de Trabajo (AST) Taladro de Banco","bloques":[{"ref":"plan"},{"n":2,"etapas":[{"etapa":"Taladro de banco (inspección de la máquina","riesgos":[["Contacto eléctrico, golpes, atrapamiento","Revisar cables, protecciones, interruptor y estado general del equipo."]]},{"etapa":"Selección y montaje de broca","riesgos":[["Cortes, golpes","Utilizar brocas adecuadas y en buen estado. Realizar el montaje con la máquina detenida."]]},{"etapa":"Sujeción de pieza","riesgos":[["Golpes, atrapamiento, proyección de pieza","Sujetar la pieza mediante mordaza o dispositivo adecuado. No sostenerla directamente con las manos."]]},{"etapa":"Puesta en marcha","riesgos":[["Atrapamiento, cortes","Verificar que la broca esté correctamente instalada y retirar la llave del portabrocas antes de arrancar."]]},{"etapa":"Perforación","riesgos":[["Cortes, proyección de virutas, rotura de broca","Utilizar protección ocular. Seleccionar correctamente velocidad y avance. Mantener las manos alejadas de la broca."]]}]},{"ref":"izaje"},{"ref":"aseo"},{"ref":"grua"}]},"ms_cnc":{"titulo":"Análisis Seguro de Trabajo (AST) Máquinas y Equipos CNC","bloques":[{"ref":"plan"},{"n":2,"etapas":[{"etapa":"Maquina CNC (Inspección de la máquina)","riesgos":[["Contacto eléctrico, golpes, atrapamiento","Revisar estado de la máquina, protecciones, puertas, enclavamientos y parada de emergencia."]]},{"etapa":"Preparación del programa","riesgos":[["Colisión, rotura de herramienta, proyección de piezas","Revisar y verificar el programa antes de ejecutarlo. Comprobar coordenadas, herramientas y parámetros."]]},{"etapa":"Montaje de pieza","riesgos":[["Golpes, atrapamiento, caída o proyección de pieza","Sujetar correctamente la pieza y verificar el sistema de fijación antes de iniciar el proceso."]]},{"etapa":"Montaje de herramientas","riesgos":[["Cortes, golpes, atrapamiento","Realizar el montaje según procedimiento y con las condiciones de seguridad establecidas."]]},{"etapa":"Configuración y prueba","riesgos":[["Movimientos inesperados, colisión, atrapamiento","Verificar parámetros y utilizar modo de prueba/single block cuando corresponda. Mantener puertas cerradas."]]},{"etapa":"Mecanizado automático","riesgos":[["Atrapamiento, golpes, cortes, proyección de virutas","No ingresar al área de mecanizado durante el ciclo. Mantener puertas y protecciones cerradas."]]},{"etapa":"Apertura de máquina","riesgos":[["Cortes, quemaduras, contacto con piezas móviles","Esperar la detención completa antes de abrir. Verificar que no existan movimientos residuales."]]},{"etapa":"Retiro y medición de pieza","riesgos":[["Cortes, golpes, quemaduras","Manipular la pieza con precaución y realizar mediciones con la máquina detenida."]]},{"etapa":"Limpieza","riesgos":[["Cortes, pinchazos, contacto con refrigerante","Utilizar herramientas para retirar virutas. Mantener el área limpia y utilizar los EPP correspondientes."]]}]},{"ref":"izaje"},{"ref":"aseo"},{"ref":"grua"}]},"ms_metalizado":{"titulo":"Análisis Seguro de Trabajo (AST) Metalizado","bloques":[{"ref":"plan"},{"n":2,"etapas":[{"etapa":"Recepción y posicionamiento de la pieza","riesgos":[["Golpes, atrapamiento de manos, caída de la pieza, sobreesfuerzo y cortes por bordes metálicos.","Verificar peso y dimensiones. Utilizar medios mecánicos de manipulación cuando corresponda. Asegurar la pieza. Utilizar guantes adecuados. Mantener manos fuera de puntos de atrapamiento"]]},{"etapa":"Inspección de equipos de metalizado","riesgos":[["Contacto eléctrico, fuga de gases, falla del equipo, incendio o explosión.","Inspeccionar máquina/equipo de metalizado, cables, conexiones, mangueras, reguladores, pistola y accesorios. No utilizar elementos deteriorados. Verificar conexiones y protecciones antes de iniciar"]]},{"etapa":"Preparación y posicionamiento de piezas","riesgos":[["Atrapamiento, golpes, caída de componentes, cortes por bordes metálicos y sobreesfuerzo.","Utilizar medios de apoyo adecuados. Mantener manos fuera de puntos de atrapamiento. Asegurar las piezas antes de intervenir. Utilizar guantes adecuados y apoyo mecánico para cargas de mayor peso"]]},{"etapa":"Preparación de superficie para metalizado","riesgos":[["Caida de mismo nivel","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados."],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"],["Proyección de partículas, polvo metálico, ruido, cortes, exposición a contaminantes y lesiones oculares.","Utilizar protección ocular/facial, protección auditiva, guantes y protección respiratoria según evaluación. Implementar extracción/ventilación cuando corresponda. Mantener el área controlada."]]},{"etapa":"Limpieza/desengrase de la pieza","riesgos":[["Contacto con productos químicos, inhalación de vapores, salpicaduras, incendio y contaminación del área.","Revisar HDS del producto utilizado. Utilizar guantes compatibles, protección ocular y protección respiratoria cuando corresponda. Mantener ventilación adecuada. Mantener productos alejados de fuentes de ignición."]]},{"etapa":"Aplicación del metalizado","riesgos":[["Inhalación de humos y partículas metálicas, radiación, quemaduras, proyección de partículas, ruido e incendio.","Utilizar protección respiratoria según evaluación de exposición. Implementar extracción localizada/ventilación. Utilizar protección ocular/facial, guantes, ropa de trabajo adecuada y protección auditiva. Mantener distancia segura y controlar el acceso al área."]]},{"etapa":"Enfriamiento de la pieza","riesgos":[["Quemaduras por contacto con superficies calientes, incendio y exposición a material caliente","Delimitar la zona de enfriamiento. Señalizar piezas calientes. No manipular hasta alcanzar una condición segura. Utilizar elementos de protección para manipulación cuando corresponda."]]},{"etapa":"Limpieza del área y retiro de residuos","riesgos":[["Exposición a polvo y residuos metálicos, cortes, tropiezos y contaminación.","Realizar limpieza mediante métodos que eviten dispersión de polvo. Utilizar EPP. Segregar residuos según su naturaleza. No utilizar aire comprimido para limpiar el cuerpo o ropa."]]},{"etapa":"Inspección final y cierre","riesgos":[["Permanencia de condiciones inseguras, equipos energizados, residuos o materiales remanentes.","Verificar que los equipos queden apagados/desenergizados cuando corresponda. Cerrar suministros. Retirar residuos y herramientas. Realizar inspección final y reportar desviaciones."]]}]},{"ref":"izaje"},{"ref":"aseo"},{"ref":"grua"}]},"ms_caliente":{"titulo":"Análisis Seguro de Trabajo (AST) Trabajo en Caliente","bloques":[{"ref":"plan"},{"n":2,"etapas":[{"etapa":"Preparación para soldadura","riesgos":[["Incendio, explosión, contacto eléctrico, exposición a radiación y humos de soldadura.","Verificar y retirar/proteger combustibles. Instalar biombos o cortinas ignífugas. Mantener extintor disponible. Verificar ventilación y condiciones del equipo."]]},{"etapa":"Trabajo en caliente sobre piezas/equipos","riesgos":[["Quemaduras, radiación UV/IR, proyección de partículas y escoria, inhalación de humos metálicos, incendio y contacto eléctrico.","Utilizar máscara de soldar con filtro adecuado, guantes de soldador, ropa cuero o ignífuga, protección respiratoria según evaluación, protección auditiva y calzado de seguridad. Utilizar extracción localizada cuando corresponda."],["Incendio, explosión, generación de gases peligrosos, calentamiento de componentes y propagación de chispas.","Verificar que recipientes, estanques, líneas o equipos hayan sido descontaminados y declarados seguros antes de soldar. Controlar chispas y escoria. Mantener vigilancia contra incendios."]]},{"etapa":"Control de humos y ventilación","riesgos":[["Exposición a humos metálicos, gases y partículas respirables.","Implementar ventilación general y preferentemente extracción localizada. Evitar posicionarse directamente sobre la pluma de humo. Utilizar protección respiratoria definida por la evaluación de riesgos."]]},{"etapa":"Término de soldadura","riesgos":[["Quemaduras por superficies calientes, incendio por puntos calientes y contacto eléctrico.","Desenergizar equipos cuando corresponda. Dejar enfriar las piezas. No tocar superficies calientes sin verificar temperatura. Revisar el área en búsqueda de chispas o puntos calientes."]]},{"etapa":"Retiro de equipos y orden del área","riesgos":[["Golpes, cortes, tropiezos, contacto eléctrico y exposición a residuos metálicos.","Desconectar y almacenar equipos correctamente. Retirar cables y mangueras. Eliminar escoria y residuos una vez fríos. Mantener orden y aseo. Gestionar residuos según procedimiento."]]},{"etapa":"Instalación y posicionamiento de cilindros","riesgos":[["Caída o volcamiento de cilindros, golpe, fuga de gas, incendio.","Mantener cilindros en posición vertical y asegurados. Separar y controlar cilindros según procedimiento aplicable. Mantenerlos alejados de fuentes de calor y protegidos contra golpes."]]},{"etapa":"Encendido del soplete","riesgos":[["Retroceso de llama, incendio, quemaduras, explosión.","Verificar previamente el estado del equipo y dispositivos de seguridad contra retroceso de llama cuando correspondan. Encender mediante método seguro. Mantener el soplete alejado de materiales combustibles y personas."]]},{"etapa":"Ejecución del oxicorte","riesgos":[["Quemaduras, radiación, proyección de partículas y escoria, incendio, inhalación de humos, explosión.","Utilizar EPP adecuado: protección ocular/facial específica para oxicorte, guantes de cabritillas, calzado de seguridad y protección respiratoria cuando la evaluación lo determine. Mantener ventilación adecuada."]]},{"etapa":"Corte de piezas metálicas","riesgos":[["Caída o desplazamiento de piezas, atrapamiento, cortes, quemaduras, proyección de partículas.","Asegurar y soportar correctamente la pieza. Verificar trayectoria de caída de material cortado. Mantener manos fuera de puntos de atrapamiento. Utilizar herramientas adecuadas para manipular piezas calientes."]]},{"etapa":"Término del corte y apagado del equipo","riesgos":[["Fuga de gases, retroceso de llama, quemaduras, incendio.","Apagar el soplete, Cerrar válvulas de los cilindros. Liberar presión de las líneas cuando corresponda. Verificar que no existan fugas ni fuentes de ignición remanentes."]]}]},{"ref":"izaje"},{"ref":"aseo"},{"ref":"grua"}]},"ms_otros":{"titulo":"Análisis Seguro de Trabajo (AST) Machine Shop · Otros trabajos","bloques":[{"ref":"plan"},{"ref":"aseo"},{"ref":"izaje"},{"ref":"grua"}]},"granallado":{"titulo":"Análisis Seguro de Trabajo (AST) Granallado — Cabina exterior","bloques":[{"ref":"plan"},{"n":2,"etapas":[{"etapa":"Recepción y posicionamiento de la pieza en la cabina","riesgos":[["Golpes, atrapamiento de manos, caída de la pieza, sobreesfuerzo y cortes por bordes metálicos.","Verificar peso y dimensiones. Utilizar medios mecánicos de manipulación cuando corresponda. Asegurar la pieza sobre el soporte de la cabina. Utilizar guantes adecuados. Mantener manos fuera de puntos de atrapamiento."]]},{"etapa":"Inspección de la cabina y del equipo de granallado","riesgos":[["Contacto eléctrico, falla del equipo, rotura de mangueras y liberación de aire a presión.","Inspeccionar cabina, mangueras, acoples, boquilla, válvula de hombre muerto, filtros y línea de aire respirable. No utilizar elementos deteriorados. Verificar conexión a tierra y estado de los cables. Registrar en check list y no operar ante cualquier deficiencia."],["Falla del sistema de extracción o de iluminación de la cabina.","Verificar funcionamiento de la extracción y de la iluminación antes de iniciar. No operar con visibilidad deficiente ni con extracción fuera de servicio."]]},{"etapa":"Carga y manejo del abrasivo","riesgos":[["Sobreesfuerzo, caída de sacos, exposición a polvo y a sílice cristalina.","No levantar carga mayor a 25 kg por trabajador hombre, solicitar ayuda mecánica en caso de sobrepasar el peso máximo de manipulación. Verificar la hoja de datos de seguridad del abrasivo. Utilizar protección respiratoria. Cargar con la cabina detenida y despresurizada."]]},{"etapa":"Puesta en marcha y presurización del equipo","riesgos":[["Latigazo de manguera, proyección violenta de abrasivo y golpes por movimiento inesperado.","Verificar que todos los acoples cuenten con pasador y cable de retención (whipcheck). Comprobar la válvula de hombre muerto antes de presurizar. Dirigir la boquilla hacia zona segura al probar. Nadie más dentro de la cabina durante la puesta en marcha."]]},{"etapa":"Granallado de la pieza","riesgos":[["Proyección de abrasivo y partículas, impacto sobre el operador o terceros.","Operar únicamente con la cabina cerrada. Utilizar capucha con suministro de aire respirable, buzo, guantes y polainas. Nunca dirigir la boquilla hacia personas ni hacia sí mismo. Mantener el área delimitada y señalizada."],["Exposición a ruido sobre el límite permisible.","Utilizar protección auditiva doble (tapones más fono) durante toda la operación. Limitar el tiempo de exposición según la evaluación del área."],["Exposición a polvo y a sílice cristalina.","Verificar la calidad del aire de la línea respirable y el estado del filtro. Mantener la extracción operativa. No retirar la capucha dentro de la cabina ni mientras exista polvo en suspensión."],["Caída de mismo nivel por acumulación de abrasivo en el piso.","Verificar vías de tránsito despejadas, no obstruidas y no humedecidas; en caso de estar, señalizar debidamente. Retirar el abrasivo acumulado. Utilizar zapatos de seguridad adecuados."]]},{"etapa":"Recuperación del abrasivo y limpieza de la cabina","riesgos":[["Exposición a polvo y residuos, cortes, tropiezos y contaminación.","Realizar la limpieza mediante métodos que eviten la dispersión de polvo. No utilizar aire comprimido para limpiar ropa ni superficies. Utilizar EPP. Segregar los residuos según su naturaleza."]]},{"etapa":"Retiro de la pieza y control de superficie","riesgos":[["Cortes por superficie rugosa, golpes y sobreesfuerzo.","Utilizar guantes anticorte. Emplear ayuda mecánica sobre 25 kg. Manipular la pieza solo con la cabina despresurizada y el equipo detenido."]]},{"etapa":"Cierre: despresurizado, desenergizado y orden del área","riesgos":[["Permanencia de condiciones inseguras, equipos presurizados o energizados y residuos en el área.","Despresurizar el equipo y cerrar el suministro de aire. Desenergizar cuando corresponda. Retirar residuos y herramientas. Realizar inspección final del área antes de retirarse."]]}]},{"n":3,"etapas":[{"etapa":"Exposición solar y temperatura ambiental (cabina en el exterior)","riesgos":[["Exposición a radiación ultravioleta, golpe de calor y deshidratación.","Aplicar protector solar FPS 50 antes y durante la jornada. Utilizar legionario y ropa de manga larga. Hidratarse periódicamente. Establecer pausas en zona de sombra. Programar el trabajo evitando las horas de mayor radiación cuando sea posible."],["Exposición a baja temperatura y viento frío en horario nocturno.","Utilizar ropa de abrigo adecuada bajo el equipo de protección. Establecer pausas en recinto cerrado."]]},{"etapa":"Viento y dispersión de abrasivo hacia otras áreas","riesgos":[["Dispersión de polvo y abrasivo hacia personas, vehículos o áreas contiguas.","Verificar la dirección y la intensidad del viento antes de iniciar. Mantener la cabina cerrada y las barreras o faldones en posición. Suspender la actividad ante viento fuerte. Comunicar la tarea a las áreas colindantes."]]},{"etapa":"Lluvia, humedad y estado del piso exterior","riesgos":[["Caída de mismo nivel por piso húmedo, irregular o con abrasivo suelto.","Verificar vías de tránsito despejadas, no obstruidas y no humedecidas; en caso de estar, señalizar debidamente. Utilizar zapatos de seguridad adecuados. Suspender la actividad ante lluvia. Verificar la aislación eléctrica de los equipos antes de energizar en condiciones de humedad."]]},{"etapa":"Tránsito de vehículos y equipos móviles en el exterior","riesgos":[["Atropello o colisión por circulación de camiones, grúa horquilla u otros equipos móviles.","Delimitar y señalizar el perímetro de trabajo con conos y barreras. Utilizar chaleco reflectante. Establecer contacto visual con los operadores antes de cruzar. No dar la espalda a las vías de circulación."]]},{"etapa":"Iluminación en trabajo nocturno","riesgos":[["Iluminación insuficiente, tropiezos y errores de operación.","Verificar iluminación artificial suficiente en la cabina y en el área de circulación. Utilizar iluminación portátil certificada. No iniciar la actividad con iluminación deficiente."]]}]},{"ref":"izaje"},{"ref":"aseo"},{"ref":"grua"}]},"miscelaneos":{"titulo":"Análisis Seguro de Trabajo (AST) Trabajos Misceláneos","bloques":[{"ref":"plan"},{"etapas":[{"etapa":"Corte con esmeril angular, sierra o tronzadora","riesgos":[["Proyección de partículas y chispas, cortes, contacto con el disco y rotura del disco.","Verificar estado del disco y de la guarda antes de usar. No retirar la guarda. Utilizar antiparras y careta facial, guantes anticorte y ropa de trabajo. Sujetar firmemente la pieza. Esperar la detención total antes de dejar la herramienta."],["Contacto eléctrico por cables o extensiones en mal estado.","Inspeccionar cables, enchufes y extensiones. No utilizar elementos deteriorados. Verificar conexión a tierra y protección diferencial. No dejar cables sobre vías de tránsito ni sobre superficies húmedas."],["Exposición a ruido y a polvo metálico.","Utilizar protección auditiva y protección respiratoria según la evaluación del área. Ventilar o extraer cuando se trabaje en recinto cerrado."]]},{"etapa":"Oxicorte","riesgos":[["Incendio o explosión por gases combustibles y proyección de escoria incandescente.","Contar con permiso de trabajo en caliente. Verificar mangueras, válvulas antirretorno y reguladores. Cilindros asegurados en posición vertical. Retirar material combustible en un radio mínimo de 10 metros o proteger con manta ignífuga. Extintor operativo a la vista. Mantener vigilancia contra incendios durante y después del trabajo."],["Quemaduras, radiación y humos de corte.","Utilizar lentes de oxicorte, ropa y guantes de cuero, coleto y polainas. Extracción o ventilación forzada. Señalizar la pieza caliente y delimitar la zona."]]},{"etapa":"Fabricación, armado y ajuste de piezas","riesgos":[["Golpes, cortes por bordes metálicos, atrapamiento y sobreesfuerzo.","Utilizar guantes anticorte. Mantener manos fuera de puntos de atrapamiento. Asegurar las piezas antes de intervenir. No levantar carga mayor a 25 kg por trabajador hombre, solicitar ayuda mecánica en caso de sobrepasar el peso máximo de manipulación."]]}],"n":2},{"n":3,"etapas":[{"etapa":"Preparación para soldadura","riesgos":[["Incendio, explosión, contacto eléctrico, exposición a radiación y humos de soldadura.","Verificar y retirar/proteger combustibles. Instalar biombos o cortinas ignífugas. Mantener extintor disponible. Verificar ventilación y condiciones del equipo."]]},{"etapa":"Trabajo en caliente sobre piezas/equipos","riesgos":[["Quemaduras, radiación UV/IR, proyección de partículas y escoria, inhalación de humos metálicos, incendio y contacto eléc function fmtRut(v){
  let s=String(v||'').toUpperCase().replace(/[^0-9K]/g,'');
  if(s.length>9) s=s.slice(0,9);
  if(s.length<2) return s;
  const dv=s.slice(-1); let n=s.slice(0,-1), out='';
  while(n.length>3){ out='.'+n.slice(-3)+out; n=n.slice(0,-3); }
  return n+out+'-'+dv;

const LOCAL={
  get(t){ try{ return JSON.parse(localStorage.getItem('ast_db_'+t)||'[]'); }catch(e){ return []; } },
  set(t,v){ try{ localStorage.setItem('ast_db_'+t,JSON.stringify(v)); }catch(e){ toast('Sin espacio en el equipo'); } },
  uid(){ return 'loc-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); },
  req(path,opt){
    const partes=path.split('?'), tabla=partes[0], P=new URLSearchParams(partes[1]||'');
    let filas=LOCAL.get(tabla);
    const metodo=(opt&&opt.method)||'GET', body=(opt&&opt.body)?JSON.parse(opt.body):null;
    const filtros=[]; P.forEach((v,k)=>{ if(['select','order','limit','offset'].indexOf(k)<0) filtros.push([k,v]); });
    const pasa=r=>filtros.every(f=>{ const k=f[0],v=f[1],val=String(r[k]==null?'':r[k]);
      if(v.indexOf('not.in.')===0) return v.slice(7).replace(/[()]/g,'').split(',').indexOf(val)<0;
      if(v.indexOf('eq.')===0)  return val===v.slice(3);
      if(v.indexOf('neq.')===0) return val!==v.slice(4);
      if(v.indexOf('in.')===0)  return v.slice(3).replace(/[()]/g,'').split(',').indexOf(val)>=0;
      if(v.indexOf('gte.')===0) return val>=v.slice(4);
      if(v.indexOf('lt.')===0)  return val<v.slice(3);
      if(v.indexOf('gt.')===0)  return val>v.slice(3);
      if(v.indexOf('lte.')===0) return val<=v.slice(4);
      return true; });
    if(metodo==='GET'){
      let res=filas.filter(pasa);
      const ord=P.get('order');
      if(ord){ const c=ord.split('.')[0], d=ord.split('.')[1];
        res.sort((a,b)=>{const x=String(a[c]||''),y=String(b[c]||'');return x<y?-1:x>y?1:0;});
        if(d==='desc') res.reverse(); }
      const lim=P.get('limit'); if(lim) res=res.slice(0,+lim);
      return res;
    }
    if(metodo==='POST'){ const n=Object.assign({id:LOCAL.uid(),creado:new Date().toISOString()},body);
      filas.push(n); LOCAL.set(tabla,filas); return [n]; }
    if(metodo==='PATCH'){ const out=[]; filas.forEach((r,i)=>{ if(pasa(r)){ filas[i]=Object.assign({},r,body); out.push(filas[i]); } });
      LOCAL.set(tabla,filas); return out; }
    if(metodo==='DELETE'){ LOCAL.set(tabla,filas.filter(r=>!pasa(r))); return []; }
    return [];
  },
  borrar(){ ['ast_db_ast_registros','ast_db_ast_participantes','ast_db_ast_config'].forEach(k=>localStorage.removeItem(k)); }
};

let enviando=false;
async function enviarCola(manual){
  if(enviando || !COLA.length || !EN_SERVIDOR) { if(manual&&!COLA.length) toast('No hay nada pendiente'); return; }
  enviando=true;
  let ok=0;
  while(COLA.length){
    const it=COLA[0];
    try{
      const r=await fetch(CONFIG.SB_URL+'/rest/v1/'+it.path,{method:it.opt.method,body:it.opt.body,headers:{
        apikey:CONFIG.SB_KEY, Authorization:'Bearer '+CONFIG.SB_KEY,
        'Content-Type':'application/json', Prefer:'return=representation'}});
      if(!r.ok && r.status>=500) break;      // servidor caído: reintentar después
      COLA.shift(); grabarCola(); ok++;
    }catch(e){ break; }                       // sigue sin señal
  }
  enviando=false; pintaCola();
  if(ok){ toast(ok+' acción(es) enviada(s) a la nube'); if(AREA&&LIN){ try{ await cargar(); }catch(e){} } render(); }
  else if(manual) toast('Sigue sin conexión. Se reintentará solo.');
}

async function api(path,opt){
  if(MODO_LOCAL) return LOCAL.req(path,opt);
  let r, ctl=null, to=null;
  try{
    try{ ctl=new AbortController(); to=setTimeout(()=>ctl.abort(), CONFIG.ESPERA_MAX_MS); }catch(e){ ctl=null; }
    r=await fetch(CONFIG.SB_URL+'/rest/v1/'+path,Object.assign({signal:ctl?ctl.signal:undefined,headers:{
      apikey:CONFIG.SB_KEY, Authorization:'Bearer '+CONFIG.SB_KEY,
      'Content-Type':'application/json', Prefer:'return=representation'}},opt||{}));
    if(to) clearTimeout(to);
  }catch(e){
    if(to) clearTimeout(to);
    // En un servidor real NO se cae al modo prueba: guardar en el equipo una firma
    // que nadie más verá es peor que avisar del problema.
    if(EN_SERVIDOR){
      const m=(opt&&opt.method)||'GET';
      if(m==='POST'||m==='PATCH'||m==='DELETE'){
        encolar(path,opt,path.split('?')[0]);
        const err=new Error('Sin conexión: la acción quedó en cola y se enviará al recuperar la señal.');
        err.cola=true; throw err;
      }
      throw new Error('Sin conexión con la nube. Revisa la señal e inténtalo otra vez.');
    }
    MODO_LOCAL=true; try{ localStorage.setItem('ast_modo','local'); }catch(e2){}
    pintaModo(); toast('Sin conexión: se activó el modo prueba');
    return LOCAL.req(path,opt);
  }
  if(!r.ok){const t=await r.text();throw new Error('Supabase '+r.status+': '+t);}
  const t=await r.text(); return t?JSON.parse(t):null;
}

  const ini=hm2min(a.hora_inicio), fin=hm2min(a.hora_fin), ahora=hm2min(ahoraHM());
  if(ini!=null&&fin!=null&&a.estado==='firmada'){
    const dentro = fin>ini ? (ahora>=ini&&ahora<=fin) : (ahora>=ini||ahora<=fin);
    // margen: una AST recién firmada no se marca vencida de inmediato

    if(!dentro && !recienTocada) return 'vencida';

  if(!IDENT){ n.innerHTML=''; return; }
  let h='';
  if(VISTAS_FORM.indexOf(vista)>=0 && vista!=='ident'){
    n.innerHTML='<span onclick="salirForm()">‹ Volver</span>'; return;
  }
  if(archivoAbierto) h='<span onclick="volverArchivo()">‹ Guardados</span>';
  else if(AREA){
    h='<span onclick="ir(null)">‹ Inicio</span>';
    if(LIN&&LIN!=='UNICA'&&lineasDe(AREA)) h+=' · <span onclick="ir(\''+AREA+'\')">'+esc(AREAS[AREA].n)+'</span>';
  }else if(vista==='stats'||vista==='archivo'||vista==='firmas') h='<span onclick="vista=\'\';render()">‹ Inicio</span>';
  n.innerHTML=h;
}
function placa(est){
  const e=ETIQ[est]||ETIQ.ninguna;
  const editable = (est==='borrador' && !archivoAbierto);
  const sub = editable ? 'Toca aquí para continuar' : e[1];
  return '<div class="placa '+est+(editable?' click':'')+'"'+
    (editable?' onclick="vista=\'crear\';render();arriba()"':'')+'>'+
    '<div class="lamp"></div><div><div class="t1">'+e[0]+'</div><div class="t2">'+sub+'</div></div>'+
    (editable?'<div class="ir">›</div>':'')+'</div>';
}
let RETORNO=null;
function edLink(dest){
  if(!esAdmin()) return '';
  return '<span class="edit" onclick="irEditar(\''+dest+'\')">Editar</span>';
}
function irEditar(dest){
  if(!esAdmin()) return;
  RETORNO = AREA ? {a:AREA,l:LIN} : null;
  if(dest==='adm-area'){ const k=AREA; AREA=null; LIN=null; ast=null; editarArea(k); return; }
  if(dest==='adm-doc') EDOC=docDe(AREA,LIN);
  AREA=null; LIN=null; ast=null; parts=[]; archivoAbierto=false;
  vista=dest; render(); arriba();
}
function btnRetorno(){
  return RETORNO ? [['Volver a la AST','sec',()=>{ const r=RETORNO; RETORNO=null; ir(r.a,r.l); }]] : [];
}
function fila(k,v){return '<tr><th style="width:38%">'+k+'</th><td>'+esc((v===0||v)?v:'—')+'</td></tr>';}
const SN=v=>v===true?'SÍ':v===false?'NO':'—';

/* ---------- Identificación ---------- */
function renderIdent(){
  const primera=!IDENT;
  $('#titulo').textContent = primera ? '¿Quién eres?' : 'Cambiar de persona';
  $('#meta').textContent = (!primera||W.identDesdePortada) ? 'Al terminar elegirás dónde entrar' : '';
  $('#app').innerHTML='<div class="card"><h2>Identificación</h2>'+
    '<p class="mini">Tus datos quedan guardados solo en este dispositivo. Toda AST que crees, edites o firmes quedará a tu nombre.</p>'+
    '<label>Nombre completo</label><input id="i_nom" autocomplete="name" value="'+esc(IDENT?IDENT.nombre:'')+'">'+
    '<div class="row"><div><label>RUT</label><input id="i_rut" inputmode="numeric" placeholder="12.345.678-9" value="'+esc(IDENT?IDENT.rut:'')+'"></div>'+
    '<div><label>Cargo</label><input id="i_car" placeholder="Mecánico" value="'+esc(IDENT?IDENT.cargo:'')+'"></div></div>'+
    '<label>Empresa</label><input id="i_emp" value="'+esc(IDENT&&IDENT.empresa?IDENT.empresa:CONFIG.EMPRESA)+'"></div>';
  const aPortada = !primera || W.identDesdePortada;
  const b=[[aPortada?'Aceptar':'Continuar','',()=>{
    if(!document.querySelector('#i_nom')) return;
    const n=V('#i_nom').trim(), r=fmtRut(V('#i_rut'));
    if(!n) return toast('Falta el nombre');
    if(!r) return toast('Falta el RUT');
    guardarIdent({nombre:n,rut:r,cargo:V('#i_car').trim(),empresa:V('#i_emp').trim()});
    W.identDesdePortada=false;
    if(aPortada){ volverPortada(); toast('Listo, '+n.split(' ')[0]+'. Elige dónde entrar.'); }
    else { vista=''; render(); toast('Listo, '+n.split(' ')[0]); }
  }]];
  if(!primera) b.push(['Volver','sec',()=>{ W.identDesdePortada=false; vista=''; render(); }]);
  barra(b);
}

/* ---------- Acceso a la sesión de supervisión ---------- */
function renderAcceso(){
  const admin = destinoSesion==='admin';
  const rev = destinoSesion==='revisor';
  $('#titulo').textContent = admin?'Sesión administrador':(rev?'Prevención de Riesgos':'Sesión supervisión');
  $('#meta').textContent='Acceso con clave';
  $('#app').innerHTML='<div class="card '+(admin?'sec5':'sec7')+'"><h2>'+(admin?'Ingreso de administración':'Ingreso de supervisión')+'</h2>'+
    '<p class="mini">'+(admin
      ? 'Habilita la edición de áreas, líneas, formularios, catálogos y ajustes generales, además de todo lo de supervisión.'
      : rev
        ? 'Acceso para Prevención de Riesgos: revisión de las AST firmadas y sin firmar, bandeja de firmas, estadísticas e historial completo.'
        : 'Habilita la bandeja de firmas, las estadísticas y el historial del taller.')+'</p>'+
    '<label>Clave</label><input id="acc_pin" type="password"'+(admin?'':' inputmode="numeric"')+'></div>';
  barra([['Ingresar','',()=>{
      if(!document.querySelector('#acc_pin')) return;
      const v=V('#acc_pin');
      if(CONFIG.CLAVE_ADMIN && v===CONFIG.CLAVE_ADMIN){
        SESION='admin'; try{sessionStorage.setItem('ast_sesion','admin');}catch(e){}
        vista=''; render(); return toast('Sesión administrador activa');
      }
      if(destinoSesion==='admin') return toast('Clave de administrador incorrecta');
      if(!pinValido(v)) return toast('Clave incorrecta');
      const s = destinoSesion==='revisor' ? 'revisor' : 'super';
      SESION=s; try{sessionStorage.setItem('ast_sesion',s);}catch(e){}
      vista=''; render(); toast(s==='revisor'?'Sesión de Prevención de Riesgos activa':'Sesión supervisión activa');
    }],['Volver','sec',()=>{vista='';render();}]]);
}

/* ---------- Selector de líneas ---------- */
async function renderLineas(){
  const A=AREAS[AREA];
  $('#titulo').textContent=A.n;
  $('#meta').textContent=fmtFecha(hoy())+' · estado de las líneas';
  $('#app').innerHTML='<p class="mini">Cargando el estado del área…</p>';
  let data=[], cnt={};
  try{
    data=await api('ast_registros?fecha=eq.'+hoy()+'&area=eq.'+AREA+VIGENTES+'&order=creado.desc');
    const ids=data.map(x=>x.id);
    if(ids.length){
      const pp=await api('ast_participantes?select=ast_id&ast_id=in.('+ids.join(',')+')');
      pp.forEach(p=>{cnt[p.ast_id]=(cnt[p.ast_id]||0)+1;});
    }
  }catch(e){
    $('#app').innerHTML='<div class="msg e">No se pudo leer el estado del área.<br><span class="mini">'+esc(e.message)+'</span></div>';
    barra([['Reintentar','sec',()=>renderLineas()],['Inicio','sec',()=>ir(null)]]); return;
  }
  const res={firmada:0,pendiente:0,borrador:0,ninguna:0,vencida:0,archivada:0,anulada:0};
  A.lineas.forEach(L=>{ res[estadoReal(data.find(x=>x.linea===L.id))]++; });
  let h='<div class="card"><h2>Resumen del área</h2><table>'+
    fila('Autorizadas (verde)',res.firmada)+fila('Pendientes de firma (rojo)',res.pendiente)+
    fila('En llenado',res.borrador)+fila('Sin AST hoy',res.ninguna)+'</table></div>';
  h+='<div class="grid">';
  A.lineas.forEach(L=>{
    const a=data.find(x=>x.linea===L.id); const e=estadoReal(a);
    h+='<div class="tile" role="button" tabindex="0" '+tinte(AREA)+' onclick="ir(\''+AREA+'\',\''+L.id+'\')">'+
       '<div class="bar" style="background:'+COLOR[e]+'"></div>'+
       '<div class="in">'+icono(AREA)+'<b>'+esc(L.n)+'</b>'+
       '<div class="est" style="color:'+COLOR[e]+'">'+ETIQ[e][0]+'</div>'+
       (a?'<small class="num">'+(a.hora_inicio||'')+'–'+(a.hora_fin||'')+' · '+(cnt[a.id]||0)+' persona(s)</small>':'')+
       (a&&a.responsable?'<small>'+esc(a.responsable)+'</small>':'')+'</div></div>';
  });
  h+='</div>';
  $('#app').innerHTML=h;
  barra([['Actualizar','sec',()=>renderLineas()],['Inicio','sec',()=>ir(null)]]);
}

/* ---------- Vista de la AST ---------- */

  const est=estadoReal(ast); const A=AREAS[AREA]; const D=documento(AREA,LIN); let h='';
  h+='<div class="card">'+placa(est)+'</div>';
  if(!ast){
    if(avisoArchivo) h+='<div class="msg i">La AST anterior terminó su vigencia'+
      (avisoArchivo.fin?' a las '+esc(avisoArchivo.fin)+' hrs':'')+' y quedó guardada en el historial. Puedes crear una nueva.</div>';
    h+='<div class="card"><h2>Iniciar el día</h2>'+
       '<p class="mini">No existe AST para <b>'+esc(tituloAL(AREA,LIN))+'</b> con fecha '+fmtFecha(hoy())+'.</p>'+
       '<p class="mini">Formulario que aplica: <b>'+esc(D.titulo)+'</b></p></div>';
    $('#app').innerHTML=h;
    barra([['Crear la AST del día','',()=>{vista='crear';render();}]].concat(lineasDe(AREA)?[['Cambiar de línea','sec',()=>ir(AREA)]]:[]));
    return;
  }
  const c=ast.contenido||{};
  if(fueraDeHorario(ast) && (est==='pendiente'||est==='borrador')){
    h+='<div class="msg e"><b>El horario de vigencia ya terminó</b> ('+esc(ast.hora_inicio||'')+' a '+esc(ast.hora_fin||'')+
       ' hrs). La AST sigue activa, pero corrige el horario antes de iniciar el trabajo.</div>';
  }

  const emo=(ANIMOS.find(x=>x[0]===c.animo)||['',''])[1];
  h+='<div class="card sec1"><h2>Antecedentes generales'+edLink('adm-area')+'</h2><table>'+
     fila('Formulario',c.docN||D.titulo)+
     ((LIN!=='UNICA'&&nombreLinea(AREA,LIN)!==AREAS[AREA].n)?fila('Línea',nombreLinea(AREA,LIN)):'')+
     fila('Nombre colaborador',ast.responsable)+
     fila('Trabajo a realizar',c.descripcion)+fila('Lugar específico',c.lugar)+
     fila('Fecha inicio',c.fechaIni?fmtFecha(c.fechaIni):fmtFecha(ast.fecha))+
     fila('Fecha término',c.fechaFin?fmtFecha(c.fechaFin):fmtFecha(ast.fecha))+
     fila('Turno y vigencia',(ast.turno||'')+' · '+(ast.hora_inicio||'')+' a '+(ast.hora_fin||'')+' hrs')+
     fila('RAN / OT',ast.ran)+fila('Equipo',ast.equipo)+fila('Cliente',ast.cliente)+
     fila('Enviada a firma de',c.supTaller)+
     '<tr><th>¿Cómo me siento hoy?</th><td>'+emo+' '+esc(c.animo||'—')+(c.animoOtro?': '+esc(c.animoOtro):'')+
       '<br><span class="mini">¿Podría afectar la realización segura de las tareas?: <b>'+esc(c.afecta||'—')+'</b></span></td></tr>'+
     (c.firmaColab?'<tr><th>Firma colaborador</th><td><img src="'+c.firmaColab+'" style="height:52px"></td></tr>':'')+
     '</table></div>';

  h+='<div class="card sec1"><h2><span class="bdg">1</span>Paso 1 · Pensar'+edLink('adm-preg')+'</h2>'+listaSN(CAT.p1,c.p1)+'</div>';
  h+='<div class="card sec2"><h2><span class="bdg">2</span>Paso 2 · Observar</h2>'+listaSN(CAT.p2,c.p2)+'</div>';
  h+='<div class="card sec3"><h2><span class="bdg">3</span>Paso 3 · Chequear</h2>'+listaSN(CAT.p3,c.p3)+
     (c.comentario?'<p style="margin-top:10px"><b>Comentario adicional:</b> '+esc(c.comentario)+'</p>':'')+'</div>';

  h+='<div class="card sec4"><h2><span class="bdg">4</span>Paso 4 · Planificación'+edLink('adm-cat')+'</h2>'+
     '<div class="sub-h">Elementos de protección personal</div><div class="pills">'+
     ((c.epp||[]).map(x=>'<span class="pill on ro"><span class="bx"></span>'+esc(x)+'</span>').join('')||'<span class="mini">Sin registro</span>')+'</div>'+
     '<div class="sub-h" style="margin-top:18px">Equipos, herramientas y maquinarias</div><div class="pills">'+
     ((c.equipos||[]).map(x=>'<span class="pill on ro"><span class="bx"></span>'+esc(x)+'</span>').join('')||'<span class="mini">Sin registro</span>')+'</div>'+
     '<table style="margin-top:12px">'+
     fila('EPP en buenas condiciones',SN(c.eppOk))+
     fila('Check list de herramientas al día',SN(c.herrOk))+'</table>'+
     (c.observacion?'<p style="margin-top:8px"><b>Observación / condiciones:</b> '+esc(c.observacion)+'</p>':'')+'</div>';

  const nR=(c.etapas||[]).reduce((s,e)=>s+(e.riesgos||[]).length,0);
  h+='<div class="card sec5"><h2><span class="bdg">5</span>Paso 5 · Análisis seguro del trabajo <span class="cnt">'+(c.etapas||[]).length+' etapas · '+nR+' riesgos</span>'+edLink('adm-doc')+'</h2>';
  (c.etapas||[]).forEach((e,i)=>{
    h+='<div class="paso"><div class="n">ETAPA '+String(i+1).padStart(2,'0')+(e.grupo?' · GRUPO '+e.grupo:'')+'</div>'+
       '<p><b>'+esc(e.etapa)+'</b></p>';
    (e.riesgos||[]).forEach(r=>{
      h+='<p><span class="k">Riesgo</span> '+esc(r[0])+'</p><p class="med"><span class="k c">Control</span> '+esc(r[1])+'</p>';
    });
    h+='</div>';
  });
  if(!(c.etapas||[]).length) h+='<p class="mini">Sin etapas registradas.</p>';
  h+='</div>';

  h+='<div class="card sec6"><h2><span class="bdg">6</span>Participantes <span class="cnt">'+parts.length+' registrados</span></h2>'+
     '<p class="mini">'+esc(DECLARACION)+'</p>';
  if(!parts.length) h+='<p class="mini" style="margin-top:10px">Nadie se ha registrado todavía.</p>';
  else parts.forEach((p,i)=>{
    h+='<div class="traza"><div class="t-a"><b>'+(i+1)+'. '+esc(p.nombre)+'</b>'+(p.firma?' <img src="'+p.firma+'" style="height:26px;vertical-align:middle">':'')+'</div>'+
       '<div class="mini"><span class="num">'+esc(p.rut||'')+'</span> · '+esc(p.cargo||'')+' · '+esc(p.empresa||'')+' · <span class="num">'+esc(p.hora||'')+'</span></div>'+
       (p.animo?'<div class="mini">Estado: '+esc(p.animo)+' · ¿Afecta la tarea?: '+esc(p.afecta||'—')+'</div>':'')+'</div>';
  });
  h+='</div>';


  if((c.auditoria||[]).length){
    h+='<div class="card sec6"><h2>Trazabilidad</h2>';
    c.auditoria.slice().reverse().forEach(x=>{
      h+='<div class="traza"><div class="t-a"><span class="num">'+esc(x.h)+'</span> · '+esc(x.a)+'</div>'+
         '<div class="mini">'+esc(x.q)+(x.r?' · <span class="num">'+esc(x.r)+'</span>':'')+'</div></div>';});
    h+='</div>';
  }

  if(ast.sup_firma){
    h+='<div class="card sec7"><h2>Autorización de supervisión</h2><table>'+
       fila('Supervisor',ast.sup_nombre)+fila('Hora de firma',ast.sup_hora)+
       (ast.sup_obs?fila('Observación',ast.sup_obs):'')+'</table>'+
       '<img src="'+ast.sup_firma+'" style="height:70px;margin-top:8px"></div>';
  }
  $('#app').innerHTML=h;

  const b=[];
  if(archivoAbierto){ barra([['Guardar PDF','',imprimir],['Descargar copia','sec',descargar],['Volver a Guardados','sec',volverArchivo]]); return; }
  if(est!=='vencida'&&est!=='anulada'&&est!=='archivada') b.push(['Registrarme','',()=>{vista='registro';render();}]);
  if(est==='borrador') b.push(['Completar AST','sec',()=>{vista='crear';render();}]);
  if(est==='pendiente') b.push(['Firmar como supervisor','ok',()=>{esSup=false;vista='firma';render();}]);
  b.push(['Guardar PDF','sec',imprimir]);
  b.push(['Descargar copia','sec',descargar]);
  if(lineasDe(AREA)) b.push(['Cambiar línea','sec',()=>ir(AREA)]);
  barra(b);
}
function listaSN(preguntas,resp){
  return preguntas.map((p,i)=>'<div class="chk"><span>'+SN((resp||[])[i])+'</span><span>'+esc(p)+'</span></div>').join('');
}

function addOtro(tipo){

function etapasElegidas(){
  const D=documento(AREA,LIN); const out=[];
  D.bloques.forEach((b,bi)=>b.etapas.forEach((e,ei)=>{
    const rs=e.riesgos.filter((r,ri)=>W.sel[bi+'-'+ei+'-'+ri]);
    if(rs.length) out.push({etapa:e.etapa,grupo:b.n,riesgos:rs});
  }));
  W.extra.filter(x=>x[0].trim()).forEach(x=>out.push({etapa:x[0],riesgos:[[x[1],x[2]]],propia:true}));
  return out;
}
function minutosEntre(a,b){
  const x=Date.parse(a), y=Date.parse(b);
  if(isNaN(x)||isNaN(y)) return null;
  const m=Math.round((y-x)/60000);
  return (m>=0 && m<24*60) ? m : null;
}
function inicioLlenado(a){
  if(!a) return null;
  const au=(a.contenido&&a.contenido.auditoria)||[];
  const prim=au.find(z=>z.ts);
  return prim? prim.ts : (a.creado||null);
}
function fmtMin(m){
  if(m==null) return '—';
  if(m<60) return m+' min';
  return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min';
}
function supElegido(){
  const sel=document.querySelector('#f_sup_sel');
  if(sel){ const v=sel.value; if(v && v!=='__otro') return v; return V('#f_sup').trim(); }
  return V('#f_sup').trim();
}
function conTraza(accion,base){
  const c=Object.assign({},base||(ast&&ast.contenido)||{});
  c.auditoria=((c.auditoria)||[]).concat([{q:IDENT.nombre,r:IDENT.rut,h:ahoraHM(),ts:new Date().toISOString(),a:accion}]).slice(-25);
  return c;
}
async function guardar(estado){
  if(!document.querySelector('#f_resp')) return;
  const etapas=etapasElegidas();
  const prev=(ast&&ast.contenido)||{};
  const cont={ descripcion:$('#f_desc').value.trim(), lugar:$('#f_lugar').value.trim(),
    fechaIni:$('#f_fini').value, fechaFin:$('#f_ffin').value,
    supTaller:supElegido(), animo:W.animo, animoOtro:V('#f_animo_otro').trim(), afecta:V('#f_afecta'),
    firmaColab: padVacio ? (prev.firmaColab||'') : $('#pad').toDataURL('image/png'),
    p1:W.p1, p2:W.p2, p3:W.p3, comentario:$('#f_com').value.trim(),
    epp:W.epp.concat(W.eppOtros||[]), equipos:W.equipos.concat(W.eqOtros||[]),
    eppOk:$('#f_eppok').value===''?null:$('#f_eppok').value==='1',
    herrOk:$('#f_herrok').value===''?null:$('#f_herrok').value==='1',
    observacion:$('#f_obs').value.trim(), etapas:etapas,
    auditoria:((ast&&ast.contenido&&ast.contenido.auditoria)||[]) };
  cont.areaN=AREAS[AREA]?AREAS[AREA].n:AREA;
  cont.lineaN=(LIN&&LIN!=='UNICA')?nombreLinea(AREA,LIN):'';
  cont.docN=(documento(AREA,LIN)||{}).titulo||'';
  const body={ fecha:hoy(), area:AREA, linea:LIN, estado:estado, doc:docDe(AREA,LIN),
    responsable:$('#f_resp').value.trim(), ran:$('#f_ran').value.trim(),
    cliente:$('#f_cli').value.trim(), equipo:$('#f_eq').value.trim(),
    turno:$('#f_turno').value, hora_inicio:$('#f_ini').value, hora_fin:$('#f_fin').value,
    actualizado:new Date().toISOString() };
  if(estado==='pendiente'){
    if(!body.responsable) return toast('Falta el responsable de la tarea');
    if(!cont.descripcion) return toast('Falta el trabajo a realizar');
    if(W.p1.concat(W.p2,W.p3).some(v=>v===null||v===undefined)) return toast('Faltan preguntas de los pasos 1, 2 y 3');
    if(!cont.epp.length) return toast('Debe marcar el EPP requerido');
    if(cont.eppOk!==true) return toast('Debe verificar que el EPP esté en buenas condiciones');
    if(cont.herrOk!==true) return toast('Debe verificar el check list de herramientas');
    if(!etapas.length) return toast('Debe marcar al menos un riesgo del trabajo');
    if(!cont.firmaColab) return toast('Falta la firma del colaborador');
    if(!cont.supTaller) return toast('Indica a qué supervisor se envía a firma');
    if(cont.animo==='Otro' && !cont.animoOtro) return toast('Indica cómo te sientes en el campo de estado emocional');
  }
  body.contenido=conTraza(
    !ast ? (estado==='pendiente'?'Creó y envió a firma':'Creó la AST')
         : (estado==='pendiente'?'Envió a firma':'Guardó cambios'), cont);
  if(estado==='pendiente'){
    const ini = ast ? inicioLlenado(ast) : null;
    body.contenido.tLlenado = ini ? minutosEntre(ini,new Date().toISOString()) : 0;
  }
  const nuevo = !ast;
  if(nuevo){ body.id=uuid(); body.creado=new Date().toISOString(); }
  try{
    if(ast) await api('ast_registros?id=eq.'+ast.id,{method:'PATCH',body:JSON.stringify(body)});
    else    await api('ast_registros',{method:'POST',body:JSON.stringify(body)});
    vista=''; await cargar(); render();
    toast(estado==='pendiente'?'AST enviada a firma del supervisor':'Borrador guardado');
  }catch(e){
    if(e.cola){
      ast = Object.assign({}, ast||{}, body);   // se refleja en el equipo mientras espera
      vista=''; render();
      toast(estado==='pendiente'
        ? 'Sin conexión: la AST quedó en cola. El supervisor la verá al recuperar señal.'
        : 'Sin conexión: el borrador quedó en cola.');
    } else toast('Error al guardar: '+e.message);
  }
}

    await api('ast_registros?id=eq.'+ast.id,{method:'PATCH',body:JSON.stringify({estado:'firmada',

      sup_firma:$('#pad').toDataURL('image/png'),sup_hora:ahoraHM(),
      actualizado:new Date().toISOString(), contenido:cont})});

/* ---------- Estadísticas ---------- */
/* ===================== GRÁFICOS ===================== */
function pol(cx,cy,r,a){const t=(a-180)*Math.PI/180;return [cx+r*Math.cos(t), cy+r*Math.sin(t)];}
function arco(cx,cy,r,a1,a2){
  const p1=pol(cx,cy,r,a1), p2=pol(cx,cy,r,a2);
  return 'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'A'+r+' '+r+' 0 '+((a2-a1)>180?1:0)+' 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
}
function velocimetro(pct,titulo,valor,color,zonas){
  pct=Math.max(0,Math.min(100,pct||0));
  const cx=100,cy=96,r=76, ang=180*pct/100;
  const z=zonas||[[0,40,'#C62828'],[40,75,'#E08A00'],[75,100,'#1B7F3B']];
  let g='<svg viewBox="0 0 200 118" class="vel">';
  z.forEach(function(s){ g+='<path d="'+arco(cx,cy,r,180*s[0]/100,180*s[1]/100)+'" stroke="'+s[2]+'" stroke-opacity=".22" stroke-width="17" fill="none" stroke-linecap="butt"/>'; });
  g+='<path d="'+arco(cx,cy,r,0,180)+'" stroke="#DCE4EC" stroke-width="1" fill="none"/>';
  g+='<path d="'+arco(cx,cy,r,0,ang)+'" stroke="'+color+'" stroke-width="17" fill="none" stroke-linecap="round"/>';
  for(var i=0;i<=10;i++){ const a=180*i/10, p1=pol(cx,cy,r-11,a), p2=pol(cx,cy,r-(i%5?5:1),a);
    g+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="#fff" stroke-width="'+(i%5?1.4:2.4)+'"/>'; }
  const pa=pol(cx,cy,r-20,ang), pb=pol(cx,cy,9,ang+90), pc=pol(cx,cy,9,ang-90);
  g+='<polygon points="'+pa[0].toFixed(1)+','+pa[1].toFixed(1)+' '+pb[0].toFixed(1)+','+pb[1].toFixed(1)+' '+pc[0].toFixed(1)+','+pc[1].toFixed(1)+'" fill="#0A2540"/>';
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="8.5" fill="#0A2540"/><circle cx="'+cx+'" cy="'+cy+'" r="3.4" fill="#fff"/>';
  g+='</svg>';
  return '<div class="vbox">'+g+'<div class="vval" style="color:'+color+'">'+esc(valor)+'</div><div class="vtit">'+esc(titulo)+'</div></div>';
}
function rosca(datos){
  const tot=datos.reduce((s,d)=>s+d[1],0)||1; const R=54, C=2*Math.PI*R; let off=0;
  let g='<svg viewBox="0 0 140 140" class="ros"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#E7EDF3" stroke-width="20"/>';
  datos.forEach(function(d){
    const frac=d[1]/tot; if(!d[1]) return;
    g+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+d[2]+'" stroke-width="20" stroke-linecap="butt"'+
       ' stroke-dasharray="'+(frac*C).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-off*C).toFixed(1)+'" transform="rotate(-90 70 70)"/>';
    off+=frac;
  });
  g+='<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#0A2540">'+tot+'</text>'+
     '<text x="70" y="84" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#6B7C8C">AST</text></svg>';
  return '<div class="rbox">'+g+'<div class="leg">'+datos.map(d=>
    '<div><span class="pt" style="background:'+d[2]+'"></span>'+esc(d[0])+' <b>'+d[1]+'</b></div>').join('')+'</div></div>';
}
function columnas(items,color){
  const max=Math.max(1,...items.map(i=>i[1]));
  return '<div class="cols">'+items.map(i=>
    '<div class="col"><div class="cv">'+i[1]+'</div><div class="cb" style="height:'+Math.max(4,Math.round(i[1]*100/max))+'%;background:'+color+'"></div>'+
    '<div class="cl">'+esc(i[0])+'</div></div>').join('')+'</div>';
}

    (sinFirma?'<p class="msg e" style="margin-top:12px">'+sinFirma+' AST del período nunca fueron firmadas por supervisión.</p>':'')+
    (animoAlerta?'<p class="msg i" style="margin-top:8px">'+animoAlerta+' declaración(es) de estado emocional que podría afectar la tarea.</p>':'')+'</div>';

  const porArea={}; Object.keys(AREAS).forEach(k=>porArea[k]={t:0,f:0,p:0});
  const cntP={}; pp.forEach(x=>{cntP[x.ast_id]=(cntP[x.ast_id]||0)+1;});
  data.forEach(x=>{ if(!porArea[x.area])porArea[x.area]={t:0,f:0,p:0};
    porArea[x.area].t++; if(x.sup_firma) porArea[x.area].f++; porArea[x.area].p+=(cntP[x.id]||0); });
  const maxT=Math.max(1,...Object.keys(porArea).map(k=>porArea[k].t));
  h+='<div class="card"><h2>AST por área</h2>';
  Object.keys(porArea).sort((a,b)=>porArea[b].t-porArea[a].t).forEach(k=>{
    const o=porArea[k];
    h+='<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13.5px">'+
       '<span>'+esc(AREAS[k]?AREAS[k].n:k)+'</span><span class="num">'+o.t+' · '+(o.t?Math.round(o.f*100/o.t):0)+'% · '+o.p+' pers.</span></div>'+
       '<div class="bara"><i style="width:'+Math.round(o.t*100/maxT)+'%"></i></div></div>';
  });
  h+='</div>';

  const sup={};
  data.forEach(x=>{
    const n=((x.contenido||{}).supTaller||'').trim(); if(!n) return;
    if(!sup[n]) sup[n]={t:0,f:0,p:0,propio:0,dem:[]};
    sup[n].t++;
    if(x.sup_firma){
      sup[n].f++;
      if((x.sup_nombre||'').trim().toLowerCase()===n.toLowerCase()) sup[n].propio++;
      const au=(x.contenido&&x.contenido.auditoria)||[];
      const env=au.filter(z=>/envi\u00f3 a firma/i.test(z.a||'')).pop();
      if(env&&x.sup_hora){ const dd=hm2min(x.sup_hora)-hm2min(env.h); if(dd>=0&&dd<600) sup[n].dem.push(dd); }
    } else if(x.estado==='pendiente') sup[n].p++;
  });
  const nombresSup=Object.keys(sup).sort((a,b)=>sup[b].t-sup[a].t);
  if(nombresSup.length){
    const maxS=Math.max(1,...nombresSup.map(k=>sup[k].t));
    h+='<div class="card sec7"><h2>Por supervisor <span class="cnt">'+nombresSup.length+'</span></h2>'+
       '<p class="mini" style="margin:-4px 0 12px">AST dirigidas a cada supervisor y qué pasó con ellas.</p>';
    nombresSup.forEach(k=>{
      const o=sup[k];
      const dm=o.dem.length?Math.round(o.dem.reduce((a,b)=>a+b,0)/o.dem.length):null;
      h+='<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:13.5px;gap:8px">'+
         '<span><b>'+esc(k)+'</b></span><span class="num">'+o.t+' asignadas · '+o.f+' firmadas'+(o.p?' · '+o.p+' pendientes':'')+'</span></div>'+
         '<div class="bara"><i style="width:'+Math.round(o.f*100/Math.max(1,o.t))+'%"></i></div>'+
         '<div class="mini">'+(o.t?Math.round(o.f*100/o.t):0)+'% autorizadas'+
         (o.f?' · '+Math.round(o.propio*100/o.f)+'% firmadas por él mismo':'')+
         (esAdmin()&&dm!=null?' · demora media '+fmtMin(dm):'')+'</div></div>';
    });
    const sinAsig=data.filter(x=>!((x.contenido||{}).supTaller||'').trim()).length;
    if(sinAsig) h+='<p class="msg i">'+sinAsig+' AST sin supervisor asignado.</p>';
    h+='</div>';
  }

  if(esSupervision()){
    const habiles=[];
    for(let i=0;i<statsDias;i++){
      const dd=new Date(); dd.setDate(dd.getDate()-i);
      if(dd.getDay()!==0) habiles.push(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0'));
    }
    const hechas={};
    data.forEach(x=>{ hechas[x.area+'|'+x.linea+'|'+x.fecha]=1; });
    let espTot=0, realTot=0; const filasCob=[];
    Object.keys(AREAS).forEach(k=>{
      const L=(lineasDe(k)||[]).filter(x=>esDiaria(k,x.id));
      if(!L.length) return;
      const esp=L.length*habiles.length;
      let real=0;
      L.forEach(l=>habiles.forEach(f=>{ if(hechas[k+'|'+l.id+'|'+f]) real++; }));
      espTot+=esp; realTot+=real;
      filasCob.push([AREAS[k].n, real, esp]);
    });
    if(espTot){
      const pct=Math.round(realTot*100/espTot);
      h+='<div class="card sec3"><h2>Cobertura de AST <span class="cnt">'+pct+'%</span></h2>'+
         '<p class="mini" style="margin:-4px 0 12px">Días hábiles con AST creada, sobre los días que cada línea debería haber trabajado. '+
         'Se cuentan '+habiles.length+' días hábiles y '+ (espTot/habiles.length) +' líneas de operación diaria. Los domingos no se consideran.</p>'+
         '<div class="vels">'+velocimetro(pct,'Cobertura del período',pct+'%','#0E8A6E')+'</div>'+
         '<table style="margin-top:12px"><tr><th>Área</th><th>Días con AST</th><th>%</th></tr>';
      filasCob.sort((x,y)=> (x[1]/x[2])-(y[1]/y[2])).forEach(f=>{
        const p=Math.round(f[1]*100/f[2]);
        h+='<tr><td>'+esc(f[0])+'</td><td class="num">'+f[1]+' de '+f[2]+'</td>'+
           '<td class="num" style="color:'+(p>=80?'var(--verde)':p>=50?'var(--ambar)':'var(--rojo)')+'"><b>'+p+'%</b></td></tr>';
      });
      h+='</table><p class="mini" style="margin-top:10px">Una cobertura baja no siempre es incumplimiento: puede ser que el área no tuvo trabajo. '+
         'Sirve para preguntar, no para concluir.</p></div>';
    } else {
      h+='<div class="card sec3"><h2>Cobertura de AST</h2><p class="mini">Ninguna línea está marcada como de operación diaria. '+
         'Márcalas en <b>Áreas y líneas</b> para medir la cobertura.</p></div>';
    }
  }

  const etp={}; data.forEach(x=>((x.contenido&&x.contenido.etapas)||[]).forEach(e=>{etp[e.etapa]=(etp[e.etapa]||0)+1;}));
  const topE=Object.keys(etp).sort((a,b)=>etp[b]-etp[a]).slice(0,10);
  if(topE.length){
    const maxE=etp[topE[0]];
    h+='<div class="card"><h2>Etapas más ejecutadas</h2>';
    topE.forEach(k=>{h+='<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:13px;gap:8px">'+
      '<span>'+esc(k)+'</span><span class="num">'+etp[k]+'</span></div>'+
      '<div class="bara"><i style="width:'+Math.round(etp[k]*100/maxE)+'%"></i></div></div>';});
    h+='</div>';
  }

  const porDia={}; data.forEach(x=>{porDia[x.fecha]=(porDia[x.fecha]||0)+1;});
  const dias=Object.keys(porDia).sort().slice(-14);
  if(dias.length){
    h+='<div class="card sec4"><h2>AST por día</h2>'+
      columnas(dias.map(d=>[d.slice(8)+'/'+d.slice(5,7),porDia[d]]),'linear-gradient(180deg,#2A73C8,#0B4EA2)')+'</div>';
  }
  const top={}; pp.forEach(x=>{ const k=x.nombre||'—'; top[k]=(top[k]||0)+1; });
  const orden=Object.keys(top).sort((a,b)=>top[b]-top[a]).slice(0,12);
  if(orden.length){
    h+='<div class="card"><h2>Participación por persona</h2><table><tr><th>Nombre</th><th>AST</th></tr>';
    orden.forEach(k=>{h+='<tr><td>'+esc(k)+'</td><td class="num">'+top[k]+'</td></tr>';});
    h+='</table></div>';
  }
  $('#app').innerHTML=h;
  barra([['Reporte del período (PDF)','',reportePeriodo],
         ['Actualizar','sec',renderStats],
         ['Inicio','sec',()=>{vista='';render();}]]);
}

/* ---------- Reporte del período ---------- */
function reportePeriodo(){
  const cont=$('#app'); if(!cont) return toast('No hay estadísticas que reportar');
  const clon=cont.cloneNode(true);
  // fuera los controles: el reporte es un documento, no una pantalla
  clon.querySelectorAll('select').forEach(s=>{ const c=s.closest('.card'); if(c) c.remove(); });
  clon.querySelectorAll('[onclick]').forEach(e=>e.removeAttribute('onclick'));
  clon.querySelectorAll('button').forEach(e=>e.remove());
  const desde=fmtFecha(fechaMenos(statsDias)), hasta=fmtFecha(hoy());
  const css=document.querySelector('style').outerHTML;
  const html='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>Reporte AST '+esc(desde)+' a '+esc(hasta)+'</title>'+css+'</head><body>'+
    '<div class="hazard st-firmada"></div><header>'+
    '<div class="brand">'+esc(CONFIG.EMPRESA+' · '+CONFIG.SUCURSAL)+'</div>'+
    '<div class="h-area">Reporte de Análisis Seguro de Trabajo</div>'+
    '<div class="h-meta">Período '+esc(desde)+' al '+esc(hasta)+' · '+statsDias+' días</div>'+
    '</header><div class="wrap">'+
    '<div class="card sec1"><h2>Identificación del reporte</h2><table>'+
      fila('Empresa',CONFIG.EMPRESA)+fila('Sucursal',CONFIG.SUCURSAL)+
      fila('Período',desde+' al '+hasta)+
      fila('Emitido',fmtFecha(hoy())+' a las '+ahoraHM())+
      fila('Emitido por',(IDENT&&IDENT.nombre)||'—')+
      fila('Sesión',esAdmin()?'Administrador':'Supervisión')+
    '</table></div>'+
    clon.innerHTML+
    '<div class="card"><p class="mini">Documento generado automáticamente desde AST Digital '+CONFIG.VERSION+'. '+
    'Las cifras corresponden a las AST registradas en el sistema dentro del período indicado.</p></div>'+
    '</div></body></html>';
  imprimirDoc(html,'Reporte_AST_'+hoy());
}

/* ---------- Panel de inicio ---------- */
async function renderPanel(){
  $('#titulo').textContent='Elige tu área';
  $('#meta').textContent=fmtFecha(hoy())+' · AST del día';
  $('#app').innerHTML='<p class="mini">Cargando…</p>';
  let data=[];
  try{ data=await api('ast_registros?fecha=eq.'+hoy()+VIGENTES+'&order=creado.desc'); }
  catch(e){
    $('#app').innerHTML='<div class="msg e">No se pudo conectar con la base de datos.<br><span class="mini">'+esc(e.message)+'</span></div>';
    barra([['Reintentar','sec',()=>renderPanel()]]); return;
  }
  const rojasTotal=data.filter(x=>estadoReal(x)==='pendiente').length; PENDS=rojasTotal;
  let h='';
  if(rojasTotal) h+='<div class="msg e"'+(esSupervision()?' style="cursor:pointer" onclick="vista=\'firmas\';render()"':'')+'>'+
     '<b>'+rojasTotal+' AST esperando firma de supervisión.</b> El trabajo no puede iniciarse hasta que sean autorizadas.'+
     (esSupervision()?' <u>Ver y firmar</u>':'')+'</div>';
  h+='<div class="grid">';
  Object.keys(AREAS).forEach(k=>{
    const L=lineasDe(k);
    const firmadas=L.filter(x=>estadoReal(data.find(d=>d.area===k&&d.linea===x.id))==='firmada').length;
    const rojas=L.filter(x=>estadoReal(data.find(d=>d.area===k&&d.linea===x.id))==='pendiente').length;
    h+='<div class="tile" role="button" tabindex="0" '+tinte(k)+' onclick="ir(\''+k+'\')">'+
       '<div class="bar" style="background:'+(rojas?'var(--rojo)':(firmadas?'var(--verde)':'var(--ac)'))+'"></div>'+
       (rojas?'<div class="pin">'+rojas+'</div>':'')+
       '<div class="in">'+icono(k)+'<b>'+AREAS[k].n+'</b>'+
       '<small>'+firmadas+' de '+L.length+' autorizadas</small>'+
       '<div class="prog"><i style="width:'+Math.round(firmadas*100/L.length)+'%"></i></div></div></div>';
  });
  h+='</div>';
  h+='<div class="card" style="margin-top:14px"><h2>Código QR de ingreso</h2>'+
     '<p class="mini">Un solo QR para todo el taller, apunta a esta pantalla. Se genera cuando la aplicación esté publicada.</p>'+
     (EN_SERVIDOR?'<p class="mini num" style="word-break:break-all">'+location.origin+location.pathname+'</p>':'')+'</div>';
  h+='<div class="card"><h2>Modo de trabajo</h2><p class="mini">'+
     (MODO_LOCAL?'Estás en <b>modo prueba</b>: todo se guarda solo en este dispositivo.'
               :'Conectado a la nube. Los datos se comparten con todo el taller.')+'</p></div>';
  $('#app').innerHTML=h;
  const b=[];
  if(esSupervision()) b.push([rojasTotal?('Firmar ('+rojasTotal+')'):'Firmas pendientes',rojasTotal?'dan':'sec',()=>{vista='firmas';render();}]);
  if(esAdmin()) b.push(['Agregar nueva área','',()=>editarArea(null)]);
  b.push(['Actualizar','sec',()=>renderPanel()]);
  if(MODO_LOCAL){
    b.push(['Borrar datos de prueba','dan',async()=>{ if(await pregunta('¿Borrar las AST de prueba y la configuración guardada en este dispositivo?','Borrar')){LOCAL.borrar();renderPanel();toast('Datos de prueba borrados');} }]);
    b.push(['Usar la nube','sec',()=>{ MODO_LOCAL=false; localStorage.removeItem('ast_modo'); pintaModo(); renderPanel(); }]);
  }else b.push(['Modo prueba','sec',()=>{ MODO_LOCAL=true; localStorage.setItem('ast_modo','local'); pintaModo(); renderPanel(); }]);
  barra(b);
}


/* ===================== ADMINISTRACIÓN ===================== */
const PALETA=['#0B4EA2','#8A5A2B','#33475B','#0E6B5E','#5B3E8A','#8A3E6B','#B0561F','#0B6BA2','#6B4A1F','#B33B3B'];
let EDA=null;   // área en edición

/* ---------- Áreas y líneas ---------- */
function admAreas(){
  $('#titulo').textContent='Áreas y líneas';
  $('#meta').textContent='Administración';
  let h='<div class="msg i">Aquí defines las áreas del taller y sus líneas o máquinas. '+
        'Los pasos 1 a 4, los antecedentes, el estado emocional y la firma son iguales para todas; '+
        'lo único propio de cada área es el <b>Paso 5</b>.</div>';
  Object.keys(AREAS).forEach(k=>{
    const A=AREAS[k], L=lineasDe(k)||[];
    h+='<div class="item" style="border-left-color:'+(ACOLOR[k]||'#0B4EA2')+'" onclick="editarArea(\''+k+'\')">'+
       '<b>'+esc(A.n)+'</b><div class="mini">'+L.length+' línea(s) · formulario: '+esc((DOCS[docDe(k,null)]||{titulo:'sin asignar'}).titulo)+'</div>'+
       '<div class="mini num">id: '+k+'</div></div>';
  });
  $('#app').innerHTML=h;
  barra([['Agregar nueva área','',()=>editarArea(null)],['Inicio','sec',()=>{vista='';render();}]]);
}
function editarArea(k){
  const A=k?AREAS[k]:null;
  EDA={ id:k, nueva:!k,
    n:A?A.n:'', color:(k&&ACOLOR[k])||PALETA[0],
    doc:A?docDe(k,null):'',
    lineas:(A&&A.lineas)
      ? A.lineas.map(x=>({id:x.id,n:x.n,doc:x.doc||'',diaria:esDiaria(k,x.id)}))
      : [{id:'L1',n:'',diaria:true},{id:'OT',n:'Otros',diaria:false}] };
  vista='adm-area'; render(); arriba();
}
function admArea(){
  const E=EDA; if(!E){ vista='adm-areas'; render(); return; }
  $('#titulo').textContent=E.nueva?'Nueva área':'Editar área';
  $('#meta').textContent='Administración';
  let h='<div class="card sec1"><h2>Datos del área</h2>'+
    '<label>Nombre del área</label><input id="ea_n" value="'+esc(E.n)+'" placeholder="Ej: Mantención de bombas">'+
    '<label>Color</label><div class="pills" id="ea_col"></div>'+
    '<label>Formulario del Paso 5</label><select id="ea_doc">'+
      Object.keys(DOCS).map(d=>'<option value="'+d+'"'+(E.doc===d?' selected':'')+'>'+esc(DOCS[d].titulo)+'</option>').join('')+
      '<option value="__nuevo"'+(!E.doc?' selected':'')+'>— Crear un formulario nuevo para esta área —</option>'+
    '</select>'+
    '<p class="mini" style="margin-top:8px">Si eliges crear uno nuevo, quedará vacío y deberás cargar sus grupos, etapas y riesgos en <b>Formularios · Paso 5</b>.</p></div>';

  h+='<div class="card sec5"><h2>Líneas o máquinas <span class="cnt">'+E.lineas.length+'</span></h2>'+
     '<p class="mini" style="margin:-4px 0 11px">Cada línea lleva su propia AST del día. Deja siempre una llamada “Otros”.</p>'+
     '<div id="ea_lin"></div><button class="sec" onclick="addLinea()">+ Agregar línea</button></div>';
  $('#app').innerHTML=h;
  pintaColores(); pintaLineas();
  const b=[['Guardar área','',guardarArea]];
  if(!E.nueva && E.doc) b.push(['Editar el Paso 5 de esta área','sec',()=>{ EDOC=E.doc; vista='adm-doc'; render(); arriba(); }]);
  b.push.apply(b,btnRetorno());
  b.push(['Volver','sec',()=>{RETORNO=null;vista='adm-areas';render();}]);
  if(!E.nueva) b.push(['Eliminar área','dan',borrarArea]);
  barra(b);
}
function pintaColores(){
  $('#ea_col').innerHTML=PALETA.map(c=>'<span class="pill'+(EDA.color===c?' on':'')+'" style="justify-content:center" '+
    'onclick="EDA.color=\''+c+'\';pintaColores()"><span class="bx" style="background:'+c+';border-color:'+c+'"></span></span>').join('');
}
function pintaLineas(){
  $('#ea_lin').innerHTML=EDA.lineas.map((L,i)=>
    '<div class="paso"><div class="n">LÍNEA '+(i+1)+
    ' <span style="float:right;color:var(--rojo);cursor:pointer" onclick="delLinea('+i+')">Quitar</span></div>'+
    '<label>Nombre</label><input value="'+esc(L.n)+'" oninput="EDA.lineas['+i+'].n=this.value">'+
    '<label>Formulario propio (opcional)</label><select onchange="EDA.lineas['+i+'].doc=this.value">'+
      '<option value="">Usa el del área</option>'+
      Object.keys(DOCS).map(d=>'<option value="'+d+'"'+(L.doc===d?' selected':'')+'>'+esc(DOCS[d].titulo)+'</option>').join('')+
    '</select>'+
    '<div class="chk" style="margin-top:10px"><input type="checkbox" '+(L.diaria!==false?'checked':'')+
      ' onchange="EDA.lineas['+i+'].diaria=this.checked"><span>Opera todos los días hábiles '+
      '<span class="mini">(se cuenta en el indicador de cobertura)</span></span></div>'+
    '</div>').join('');
}
function addLinea(){ EDA.lineas.push({id:'L'+(EDA.lineas.length+1),n:'',doc:'',diaria:true}); pintaLineas(); }
function delLinea(i){ EDA.lineas.splice(i,1); pintaLineas(); }

async function guardarArea(){
  const E=EDA;
  E.n=V('#ea_n').trim();
  if(!E.n) return toast('Falta el nombre del área');
  const lineas=E.lineas.filter(L=>L.n.trim());
  if(!lineas.length) return toast('Agrega al menos una línea');
  let doc=V('#ea_doc');
  const id=E.id || slug(E.n);
  if(doc==='__nuevo'){
    doc='doc-'+id;
    CFG.docs=CFG.docs||{};
    if(!CFG.docs[doc] && !DOCS[doc]) CFG.docs[doc]={titulo:'Análisis Seguro de Trabajo (AST) '+E.n, bloques:[]};
  }
  const ids={};
  lineas.forEach((L,i)=>{
    let base=L.id||('L'+(i+1));
    if(ids[base]) base=base+(i+1);
    ids[base]=1; L.id=base;
  });
  CFG.areas=CFG.areas||{};
  logCFG(E.nueva?'Área creada':'Área modificada', E.n);
  CFG.areas[id]={ n:E.n, doc:doc, color:E.color,
    lineas:lineas.map(L=>{const o={id:L.id,n:L.n.trim(),diaria:L.diaria!==false}; if(L.doc) o.doc=L.doc; return o;}) };
  const ok=await guardarCFG();
  if(!ok) return;
  toast(E.nueva?'Área creada':'Área actualizada');
  if(V('#ea_doc')==='__nuevo'){ EDOC=doc; vista='adm-doc'; render(); arriba(); }
  else { vista='adm-areas'; render(); }
}
async function borrarArea(){
  const id=EDA.id; if(!id) return;
  const ok=await pregunta('¿Eliminar el área "'+AREAS[id].n+'"? Las AST ya guardadas se conservan, pero el área deja de aparecer.','Eliminar');
  if(!ok) return;
  CFG.areas=CFG.areas||{};
  logCFG('Área eliminada', AREAS[id]?AREAS[id].n:id);
  CFG.areas[id]={borrada:true};
  if(await guardarCFG()){ delete AREAS[id]; toast('Área eliminada'); vista='adm-areas'; render(); }
}

/* ---------- Formularios: Paso 5 ---------- */
let EDOC='';
function admDoc(){
  $('#titulo').textContent='Formularios · Paso 5';
  $('#meta').textContent='Administración';
  if(!EDOC || !DOCS[EDOC]) EDOC=Object.keys(DOCS)[0];
  const D=DOCS[EDOC];
  const et=b=>(b.ref ? ((BLOQUES[b.ref]||{}).etapas||[]) : (b.etapas||[]));
  const nE=D.bloques.reduce((s,b)=>s+et(b).length,0);
  const nR=D.bloques.reduce((s,b)=>s+et(b).reduce((t,e)=>t+e.riesgos.length,0),0);
  let h='<div class="msg i">Solo el Paso 5 cambia entre áreas. Aquí defines los grupos, las etapas y los riesgos con su medida de control.</div>';
  h+='<div class="card sec1"><h2>Formulario</h2><select onchange="EDOC=this.value;admDoc()">'+
     Object.keys(DOCS).map(d=>'<option value="'+d+'"'+(EDOC===d?' selected':'')+'>'+esc(DOCS[d].titulo)+'</option>').join('')+
     '</select><label>Título</label><input id="ed_tit" value="'+esc(D.titulo)+'">'+

     '<p class="mini" style="margin-top:8px">'+D.bloques.length+' grupo(s) · '+
     nE+' etapa(s) · '+nR+' riesgo(s)</p></div>';
  h+='<div id="ed_bl"></div>';

function pintaDoc(){

    }

      '<span class="c" style="cursor:pointer;color:var(--rojo)" onclick="delGrupo('+bi+')">Quitar grupo</span></div><div class="bl-b">';

         '<input value="'+esc(e.etapa)+'" oninput="DOCS[EDOC].bloques['+bi+'].etapas['+ei+'].etapa=this.value">'+
         '</div><div class="rg">';
      e.riesgos.forEach((r,ri)=>{
        s+='<div class="rk" style="display:block">'+
           '<label style="margin-top:6px">Riesgo '+(ri+1)+
           ' <span style="float:right;color:var(--rojo);cursor:pointer;text-transform:none;letter-spacing:0" onclick="delRiesgo('+bi+','+ei+','+ri+')">Quitar</span></label>'+
           '<input value="'+esc(r[0])+'" oninput="DOCS[EDOC].bloques['+bi+'].etapas['+ei+'].riesgos['+ri+'][0]=this.value">'+
           '<label>Medida de control</label>'+

function addGrupo(){ const D=DOCS[EDOC]; D.bloques.push({n:D.bloques.length+1,etapas:[]}); pintaDoc(); }
function addComun(){
  const D=DOCS[EDOC], id=V('#ed_comun');
  if(!id) return toast('Elige el bloque común');

  D.bloques.push({ref:id}); pintaDoc(); toast('Bloque agregado');

function delGrupo(bi){ const D=DOCS[EDOC]; D.bloques.splice(bi,1); D.bloques.forEach((b,i)=>{ if(!b.ref) b.n=i+1; }); pintaDoc(); }
function addEtapa(bi){ const b=DOCS[EDOC].bloques[bi];

  b.etapas.push({etapa:'',riesgos:[['','']]}); pintaDoc(); }
function delEtapa(bi,ei){ const b=DOCS[EDOC].bloques[bi]; if(!b||b.ref) return; b.etapas.splice(ei,1); pintaDoc(); }
function addRiesgo(bi,ei){ const b=DOCS[EDOC].bloques[bi];
  if(!b || b.ref) return toast('Los bloques comunes se editan en Bloques comunes');
  b.etapas[ei].riesgos.push(['','']); pintaDoc(); }
function delRiesgo(bi,ei,ri){ const b=DOCS[EDOC].bloques[bi]; if(!b||b.ref) return; b.etapas[ei].riesgos.splice(ri,1); pintaDoc(); }
async function guardarDoc(){
  const D=DOCS[EDOC];
  D.titulo=V('#ed_tit').trim()||D.titulo;
  D.bloques=D.bloques.filter(b=>b.ref||(b.etapas&&b.etapas.length));
  D.bloques.forEach(b=>{
    if(b.ref) return;
    b.etapas=b.etapas.filter(e=>e.etapa.trim());
    b.etapas.forEach(e=>{ e.riesgos=e.riesgos.filter(r=>r[0].trim()); });
    b.etapas=b.etapas.filter(e=>e.riesgos.length);
  });
  D.bloques=D.bloques.filter(b=>b.ref||b.etapas.length);
  D.bloques.forEach((b,i)=>{ if(!b.ref) b.n=i+1; });
  CFG.docs=CFG.docs||{}; logCFG('Formulario del Paso 5 modificado', D.titulo); CFG.docs[EDOC]=D;

async function guardarGen(){
  const turnos={};
  W.turnos.filter(t=>t.n.trim()).forEach(t=>{ turnos[t.n.trim()]=[t.a,t.b]; });
  if(!Object.keys(turnos).length) return toast('Debe existir al menos un turno');
  if(!W.animos.length) return toast('Debe existir al menos un estado emocional');
  if(!W.afecta.length) return toast('Debe existir al menos una opción de respuesta');

/* ---------- Impresión y descarga ---------- */
function nombreDoc(){
  const a=ast||{};
  return 'AST_'+(AREAS[AREA]?AREAS[AREA].n.replace(/[^A-Za-z0-9]+/g,'_'):'area')+
    (LIN&&LIN!=='UNICA'?'_'+LIN:'')+'_'+(a.fecha||hoy());
}
function docHTML(){
  const est=estadoReal(ast), e=ETIQ[est]||ETIQ.ninguna;
  const css=document.querySelector('style').outerHTML;
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>'+esc(nombreDoc())+'</title>'+css+'</head><body>'+
    '<div class="hazard st-'+est+'"></div><header>'+
    '<div class="brand">'+esc(CONFIG.EMPRESA+' · '+CONFIG.SUCURSAL)+'</div>'+
    '<div class="h-area">'+esc($('#titulo').textContent)+'</div>'+
    '<div class="h-meta">'+esc($('#meta').textContent)+' · '+esc(e[0])+'</div></header>'+
    '<div class="wrap">'+$('#app').innerHTML+'</div></body></html>';
}
function imprimirDoc(html,nombre){
  try{
    const f=document.createElement('iframe');
    f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
    document.body.appendChild(f);
    const dd=f.contentWindow.document;
    dd.open(); dd.write(html); dd.close();
    setTimeout(function(){
      try{ f.contentWindow.focus(); f.contentWindow.print(); }
      catch(e){ toast('Este visor no permite imprimir; usa Descargar'); }
      setTimeout(()=>{ try{document.body.removeChild(f);}catch(e){} },60000);
    },420);
    toast('En el diálogo elige Guardar como PDF');
  }catch(e){ toast('No se pudo abrir la impresión'); }
}
function imprimir(){
  if(!ast) return toast('No hay AST que imprimir');
  imprimirDoc(docHTML(),nombreDoc());
}
function descargar(){
  if(!ast) return toast('No hay AST que descargar');
  try{
    const b=new Blob([docHTML()],{type:'text/html;charset=utf-8'});
    const u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=nombreDoc()+'.html'; document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},1500);
    toast('Descargado. Ábrelo y usa Imprimir para guardarlo en PDF');
  }catch(err){ toast('No se pudo descargar: '+err.message); }
}

  if(pri){ f.style.display='block'; f.className='fab '+(pri[1]||''); f.textContent=pri[0]; f.onclick=pri[2]; }
  else f.style.display='none';

    // 1) guardar borrador  2) volver del formulario  3) salida al inicio
    const guardar=ACC.find(x=>x&&/^guardar borrador/i.test(x[0]));
    const volver =ACC.find(x=>x&&/^(volver|salir sin guardar)/i.test(x[0]));
    const sec = guardar || volver;

/* ---------- Encabezado fijo que se compacta al desplazar ---------- */
let compacto=false, tickScroll=false;
function alScroll(){
  if(tickScroll) return; tickScroll=true;
  requestAnimationFrame(function(){
    tickScroll=false;
    const y=window.scrollY||document.documentElement.scrollTop||0;
    const debe = compacto ? (y>40) : (y>110);
    if(debe!==compacto){
      compacto=debe;
      const hd=document.querySelector('header'), tp=document.querySelector('#top');
      if(hd) hd.classList.toggle('compact',debe);
      if(tp) tp.classList.toggle('compact',debe);
      ajustaTope();
    }
  });
}
window.addEventListener('scroll',alScroll,{passive:true});
window.addEventListener('resize',()=>{ajustaFondo();ajustaTope();});

/* ---------- Firma en canvas ---------- */
let padVacio=true;
function iniciarPad(cv){
  const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d;
  const x=cv.getContext('2d'); x.scale(d,d); x.lineWidth=2.2; x.lineCap='round'; x.strokeStyle='#10202E';
  padVacio=true; let dib=false;
  const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top];};
  const ini=e=>{e.preventDefault();dib=true;padVacio=false;const p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);};
  const mov=e=>{if(!dib)return;e.preventDefault();const p=pos(e);x.lineTo(p[0],p[1]);x.stroke();};
  const fin=()=>{dib=false;};
  cv.addEventListener('mousedown',ini);cv.addEventListener('mousemove',mov);window.addEventListener('mouseup',fin);
  cv.addEventListener('touchstart',ini,{passive:false});cv.addEventListener('touchmove',mov,{passive:false});cv.addEventListener('touchend',fin);
  window._pad=cv;
}
function limpiarPad(){const cv=window._pad;const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);padVacio=true;}

/* ---------- Retención: borrado automático a los 30 días ---------- */
async function purgar(){
  let ultimo=''; try{ ultimo=localStorage.getItem('ast_purga')||''; }catch(e){}
  if(ultimo===hoy()) return;
  const limite=fechaMenos(CONFIG.DIAS_RETENCION);
  try{
    const viejas=await api('ast_registros?fecha=lt.'+limite+'&select=id&limit=300');
    if(viejas && viejas.length){
      for(const v of viejas){
        try{ await api('ast_participantes?ast_id=eq.'+v.id,{method:'DELETE'}); }catch(e){}
        try{ await api('ast_registros?id=eq.'+v.id,{method:'DELETE'}); }catch(e){}
      }
    }
    try{ localStorage.setItem('ast_purga',hoy()); }catch(e){}
  }catch(e){}
}
