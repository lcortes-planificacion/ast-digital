const CAT={"epp":["Casco de seguridad","Barbiquejo","Lentes de seguridad (claros/ oscuros)","Legionario","Antiparras","Lentes oxicorte","Protector auditivo o tapones","Respirador doble vía","Punteras","Mascara full face","Filtro de gases y vapores orgánicos /ácidos","Filtro para respirador","Mascarilla desechable (N95)","Protector solar FPS 50","Protector facial","Mascara para soldar","Chaqueta de cuero","Coleto de cuero","Polera de Mangas largas","Pantalón de cuero","Guante de cabritilla corto y/o largo","Guantes soldador","Guantes de goma","Pantalon largo","Guantes multiflex","Guantes de alta temperatura","Buzo tipo piloto","Buzo de papel","Chaleco reflectante","Chaqueta impermeable (PVC)","Traje impermeable (PVC)","Traje resistente a altas temperaturas","Calzado de seguridad","Absorbedor de impacto","Tierra/Aserrín","Arnés de seguridad con 2 colas","Cubre calzado o botas","Polainas","Botas de goma con punta de acero","Línea de posicionamiento"],"equipos":["Equipos o herramientas manuales","Extensiones eléctricas/domiciliaria/industrial 220/380 volt","Inductor y horno","Torno y Fresadora","Equipos o herramientas eléctricas","Máquina soldar","Escaleras","Cabina de pintura","Equipos o herramientas neumáticas","Ventilador","Equipo de gammagrafía","Cabina de lavado","Equipos o herramientas hidráulicas","Tableros eléctricos","Esmeril Angular 7” y 41/2”","Grúa Horquilla","Eslingas, estrobos y cadenas","Equipos de iluminación Fijo","Taladro magnético/Dremel","Transpaleta","Tecles de cadena, palanca y tilfor","Equipos y/o herramientas de fuerza","Grupo generador","Esmeril y grata de Banco","Cancámos y grilletes","Iluminación portátil","Equipo Oxicorte y Calentador","Pistola de Impacto","Equipos y elementos de levante (Puentes)","Andamios y plataformas de trabajo","Prensas Hidráulicas","Sierra circular"],"p1":["¿ Requiere permiso autorización de jefatura para ejecución de la actividad?","¿ El grupo de trabajo esta autorizado y conoce el procedimiento o AST asociado a la tarea?","¿Se han verificados los equipos, elementos y herramientas adecuadas para la tarea?","¿ Se encuentra el equipo de protección personal disponible y adecuado para la tarea?"],"p2":["¿ Existe transito de vehículos o maquinarias en el sector?","¿ El área de trabajo se encuentra correctamente señalizada e identificada?","¿ El área de trabajo es segura : Limpia, iluminada, ventilada, plataformas o estructuras estables (cuando aplique)?","¿Es necesario realizar corte de energías (controlar/aislar) o bloquear?"],"p3":["¿ Los equipos asociados o a intervenir se encuentran de acuerdo a normas de seguridad?","¿ Se encuentran disponible los equipos de emergencia y vías de escape habilitados?","¿ Se encuentran coordinados los trabajos con otras áreas u empresas en el lugar?"]};
const BLOQUES={"aseo":{"n":"Aseo general","etapas":[{"etapa":"Aseo general","riesgos":[["Piso resbaladizo","Delimitar la zona de trabajo que este humedo para impedir el paso de personas no habilitadas, en caso de requerir trasladarse por la zona verificar el secado o proceder a secar"],["Caida de mismo nivel, Golpeado por y contra.","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados."],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario, no levantar craga mayor a 25 kg por trabajador hombre."],["Contacto con sustancias peligrosas","Verificar la compatibilidad antes de mezclar dos o mas productos, Utilizar los elementos de proteccion personal (EPP) guantes, zapatos de seguridad, ropa institucional, mantener los recipientes bien cerrados, correctamente almacenados, etiquetado y en lugares ventilados, tener la hoja de seguridad"]]}]},"grua":{"n":"Inspección previa de la grúa horquilla","etapas":[{"etapa":"Inspección previa de la grúa Horquilla","riesgos":[["Fallas mecánicas, hidráulicas o eléctricas; accidente por falla del equipo","Realizar inspección preoperacional; revisar frenos, dirección, neumáticos, horquillas, mástil, cadenas, luces, alarma de retroceso y fugas. Informar cualquier anomalía."]]},{"etapa":"Encendido y puesta en marcha","riesgos":[["Atropello, golpes, movimiento inesperado","Verificar que no existan personas u obstáculos alrededor; utilizar cinturón de seguridad y mantener las protecciones instaladas."]]},{"etapa":"Traslado sin carga","riesgos":[["Colisión, atropello, vuelco","Respetar límites de velocidad y señalización; mantener las horquillas bajas; conducir atento a peatones y condiciones del terreno."]]},{"etapa":"Traslado con carga","riesgos":[["Caída de carga, pérdida de estabilidad, vuelco","Asegurar correctamente la carga; no superar la capacidad máxima; mantener la carga baja y estable durante el desplazamiento."]]},{"etapa":"Elevación de carga","riesgos":[["Caída de materiales, vuelco, atrapamiento","No permanecer ni permitir personas bajo la carga elevada; elevar de manera gradual; respetar capacidad de carga y centro de gravedad."]]},{"etapa":"Circulación en áreas con peatones y retroceso","riesgos":[["Atropello, golpes, aplastamiento, colision","Respetar señalización; utilizar bocina en cruces y zonas de visibilidad reducida, Revisar el área antes de retroceder; utilizar alarma de retroceso y espejos; mantener velocidad controlada y contar con señalero cuando la visibilidad sea insuficiente."]]}]},"izaje":{"n":"Inspección de equipos y elementos de izaje","etapas":[{"etapa":"Inspección de equipos y elementos de izaje","riesgos":[["Falla de eslingas, grilletes, ganchos, cadenas o accesorios; caída de carga.","Inspeccionar visualmente todos los elementos antes de utilizar. Verificar capacidad de carga, identificación, certificación y estado. Retirar inmediatamente elementos deteriorados, deformados o sin identificación."]]},{"etapa":"Posicionamiento e instalacion del equipo de izaje","riesgos":[["Volcamiento, desplazamiento, cortes, montaje incorrecto, golpes contra estructuras o personas.","Posicionar el equipo sobre terreno firme y nivelado. Verificar capacidad del terreno y proteger eslingas contra bordes cortantes. Verificar correcta conexión al gancho y carga y utilizar los EPP"]]},{"etapa":"Traslado de la carga suspendida","riesgos":[["Caída de carga, balanceo, golpes contra personas o estructuras, atrapamiento.","Mantener velocidad controlada. Utilizar vientos/guía cuando corresponda. Mantener zona de exclusión. Prohibir tránsito bajo la carga. Utilizar señales previamente acordadas."]]},{"etapa":"Posicionamiento y descenso de la carga","riesgos":[["Atrapamiento, golpes, caída o desplazamiento de la carga.","Guiar la carga desde una posición segura. Mantener manos y pies fuera de puntos de atrapamiento. Descender lentamente y controlar estabilidad antes de liberar los elementos de izaje."]]},{"etapa":"Retiro de elementos de izaje","riesgos":[["Golpes, atrapamiento, caída de accesorios, sobreesfuerzo.","Retirar eslingas y accesorios una vez estabilizada la carga. No retirar elementos mientras exista riesgo de movimiento. Utilizar técnicas adecuadas de manipulación manual."]]},{"etapa":"Término y cierre de la maniobra","riesgos":[["Elementos abandonados, obstáculos, ingreso de personas al área, condiciones inseguras.","Retirar elementos de izaje y almacenarlos correctamente. Retirar señalización cuando corresponda. Realizar inspección final del área. Informar desviaciones y si es que aplica cerrar el AST."]]}]},"plan":{"n":"Planificación y coordinación de la actividad","etapas":[{"etapa":"Planificación y coordinación de la actividad","riesgos":[["Falta de coordinación, interferencia con otras actividades, ejecución sin autorización, exposición de terceros.","Elaborar y revisar AST/procedimiento. Coordinar con supervisión. Definir personal competente. Verificar autorización para trabajo en caliente. Informar al personal involucrado."],["Atrapamiento y Aplastamiento","Utilizar todos los elementos de proteccion personal (EPP), planificar la actividad y verificar que los mesones esten en buenas condicines, revisar herramientas o equipos a utilizar"],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"]]}]},"admin":{"n":"Actividades administrativas (computador)","etapas":[{"etapa":"Actividades administrativas (computador)","riesgos":[["Posturas inadecuadas (ergonomia)","Utilizar silla adecuada a las labores, tener apoya brazos y apoya mouse, estar a la altura adecuada. Realizar micro pausa"],["Digitacion en teclado","Realizar micro pausas para evitar la fatiga muscular, utilizar apoya mouse y teclado."],["Caida de mismo nivel","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados, no permitir cables cruzados."],["Golpeado por y contra","Verificar que los lugares de trabajo esten ordenados, los bordes no sean filosos"]]}]}};
const DOCS={"banco":{"titulo":"Análisis Seguro de Trabajo (AST) Banco de Pruebas de Equipos","bloques":[{"n":1,"etapas":[{"etapa":"Inspección previa del área y condiciones de trabajo","riesgos":[["Caída al mismo nivel por manchas de aceite, objetos en el piso u obstáculos. Golpes y pérdida de estabilidad durante el desplazamiento de los técnicos.","Coordinar previamente con el mecánico antes de ingresar al puesto. Mantener una distancia segura de componentes en manipulación. No ingresar a zonas de atrapamiento. Respetar las áreas delimitadas. Utilizar EPP definido para el área."],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","No levantar carga mayor a 25 kg para trabajador hombre, solicitar ayuda mecanica en caso de sobrepasar el peso maximo de manipulacion (puete grua, carros, entre otros)"],["Caída de objetos o componentes durante el proceso de desarme; golpes por movimiento inesperado de piezas.","Realizar inspección previa del área antes de iniciar el ensayo. Verificar que el piso se encuentre limpio, seco y despejado. Eliminar o controlar inmediatamente manchas de aceite y obstáculos. Mantener vías de circulación despejadas y condiciones de orden y aseo"]]},{"etapa":"Instalación de barreras de seguridad alrededor del equipo","riesgos":[["Atrapamiento con partes móviles del equipo, ingreso de personas al área de peligro, golpes por componentes en movimiento.","Instalar barreras de seguridad antes de energizar el equipo. Delimitar y señalizar el área de ensayo. Verificar que las barreras se encuentren correctamente instaladas y estables. Prohibir el ingreso de personal no autorizado durante el funcionamiento."]]},{"etapa":"Energización del motor eléctrico","riesgos":[["Contacto eléctrico / electrocución por tensión trifásica de 380 V. Cortocircuito o falla eléctrica.","Realizar conexiones por personal autorizado y competente. Inspeccionar cables, tableros, conexiones y sistemas de protección antes de energizar. Mantener cerrados y protegidos los tableros eléctricos. No intervenir conexiones con el equipo energizado. Verificar puesta a tierra y protecciones eléctricas según corresponda."]]}]},{"n":2,"etapas":[{"etapa":"Puesta en marcha del motor a baja velocidad","riesgos":[["Atrapamiento, contacto con partes móviles, proyección de componentes ante falla, ruido y vibraciones.","erificar previamente que las barreras estén instaladas. Mantener al personal fuera de la zona de peligro. Realizar el arranque desde una posición segura. Verificar comportamiento inicial del equipo, ruidos, vibraciones anormales o desplazamientos. Detener inmediatamente ante cualquier condición anormal."],["Caida de mismo nivel y distinto nivel","Mantener vias de evacuacion despejada, verificar las condiciones del terreno para la ejecucion de los trabajos."],["Golpeado por y contra","Verificar que los lugares de trabajo esten ordenados, los bordes no sean filosos"]]},{"etapa":"Aumento progresivo de velocidad hasta régimen nominal","riesgos":[["Atrapamiento, proyección o desprendimiento de componentes, vibraciones excesivas, falla mecánica, ruido y desplazamiento inesperado del equipo.","Incrementar las RPM progresivamente y de acuerdo con el procedimiento de ensayo. Mantener las barreras instaladas durante todo el proceso. No ingresar al área de peligro mientras el equipo se encuentre en movimiento. Monitorear ruidos, vibraciones y comportamiento del conjunto. Detener el ensayo ante cualquier desviación."]]}]},{"n":3,"etapas":[{"etapa":"Instalación del acelerómetro en la carcasa del reductor","riesgos":[["Caida de mismo nivel","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados."],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"],["Aplastamiento, atrapamiento","Utilizar todos los elementos de proteccion personal (EPP), planificar la actividad y verificar que los mesones esten en buenas condicines, revisar herramientas o equipos a utilizar"],["Atrapamiento con partes móviles, contacto con superficies calientes, caída del instrumento o acercamiento a la zona de peligro","Instalar el acelerómetro desde una posición segura y utilizando el método definido para la medición. No acercar las manos a partes móviles del equipo. Verificar previamente que el punto de medición sea accesible sin ingresar a la zona de atrapamiento. Mantener el cable del instrumento fuera de partes móviles."]]}]},{"n":4,"etapas":[{"etapa":"Registro de vibraciones mediante instrumento recolector","riesgos":[["Atrapamiento, golpes, caída del instrumento, contacto con superficies calientes y exposición a ruido/vibraciones.","Mantener una posición segura durante la medición. Utilizar el instrumento sin retirar las protecciones del equipo. Mantener cables ordenados y alejados de partes móviles. Utilizar protección auditiva cuando corresponda. No realizar ajustes sobre el equipo mientras esté en movimiento."]]},{"etapa":"Medición de temperatura del reductor","riesgos":[["Contacto con superficies calientes, quemaduras y acercamiento a partes móviles.","Realizar la medición desde una posición segura. Utilizar instrumento adecuado para medición sin contacto cuando corresponda. No tocar directamente la carcasa si existe posibilidad de elevada temperatura. Mantener las protecciones y barreras instaladas durante la medición"]]},{"etapa":"Funcionamiento prolongado del reductor para detección de fugas de lubricante (2–3 horas)","riesgos":[["Atrapamiento, contacto con partes móviles, exposición a superficies calientes, fuga de lubricante, incendio y caída al mismo nivel por derrames.","Mantener barreras y delimitación durante todo el ensayo. Realizar inspecciones visuales desde una posición segura. No ingresar a la zona de peligro con el equipo funcionando. Controlar posibles fugas de lubricante. En caso de derrame, detener el equipo según procedimiento y controlar inmediatamente la condición. Mantener elementos de respuesta ante derrames disponibles cuando corresponda."]]},{"etapa":"Finalización del ensayo dinámico y detención del equipo","riesgos":[["Contacto eléctrico, movimiento residual, atrapamiento y contacto con superficies calientes.","Detener el equipo mediante el sistema establecido. Esperar la detención completa de todas las partes móviles antes de retirar barreras o acercarse. Desenergizar y aplicar aislamiento cuando corresponda antes de intervenir o retirar componentes. Verificar temperatura antes de manipular."]]}]},{"n":5,"etapas":[{"etapa":"Retiro del reductor del banco de pruebas","riesgos":[["Atrapamiento, golpes, caída o desplazamiento del equipo, sobreesfuerzo y riesgo asociado a izaje/manipulación.","Verificar que el equipo se encuentre completamente detenido, desenergizado y liberado antes de iniciar el retiro. Utilizar elementos y equipos de izaje adecuados cuando corresponda. Verificar capacidad y estado de los elementos de izaje. Coordinar la maniobra y mantener despejada la trayectoria de traslado."]]},{"etapa":"Traslado del reductor aprobado hacia pintura","riesgos":[["Caída o volcamiento del componente, golpes, atrapamiento, atropello o interacción con tránsito interno.","Utilizar medios de transporte adecuados a las características y peso del reductor. Asegurar correctamente la carga. Mantener la ruta despejada. Coordinar el traslado con las áreas involucradas. Respetar vías de circulación y mantener personas alejadas de la trayectoria de la carga."]]},{"etapa":"Traslado del reductor no aprobado hacia línea de ensamble","riesgos":[["Caída o desplazamiento del componente, golpes, atrapamiento y exposición a tránsito interno.","Asegurar el componente durante el traslado. Utilizar equipos adecuados para su movilización. Coordinar previamente el ingreso a la línea de ensamble. Mantener la ruta despejada y controlar la interacción con otros trabajadores/equipos."]]}]},{"ref":"admin"},{"ref":"aseo"},{"ref":"grua"}]},"bodega":{"titulo":"Análisis Seguro de Trabajo (AST) Bodega y Recepción de Equipos","bloques":[{"n":1,"etapas":[{"etapa":"Revisar y ordenar zona de recepción y almacenamiento","riesgos":[["Caídas al mismo nivel, golpes, obstrucción de vías de tránsito","Mantener orden y aseo, demarcar áreas, mantener vías despejadas, verificar iluminación"]]},{"etapa":"Recibir equipos, materiales y componentes desde proveedores o transporte","riesgos":[["Atropello, golpes, atrapamiento, caída de materiales","Segregar peatones y vehículos, utilizar chaleco reflectante, establecer zona de descarga, coordinar maniobras"]]},{"etapa":"Descargar equipos manualmente o mediante grúa horquilla/transpaleta","riesgos":[["Sobreesfuerzo, caída de carga, aplastamiento, golpes","Evaluar peso y dimensiones, utilizar ayudas mecánicas, prohibir permanecer bajo cargas suspendidas, operador autorizado"]]},{"etapa":"Revisar estado, cantidad, embalaje y documentación","riesgos":[["Cortes, golpes, contacto con elementos dañados","Usar guantes adecuados, revisar embalajes antes de manipular, informar daños o condiciones inseguras"]]},{"etapa":"Mover equipos desde recepción hacia zona de almacenamiento","riesgos":[["Sobreesfuerzo, caída de materiales, atrapamiento, golpes","Aplicar técnicas de manipulación segura, utilizar carros/transpaletas, respetar capacidad de equipos, mantener rutas despejadas"]]},{"etapa":"Ubicar equipos en racks, estanterías o zonas demarcadas","riesgos":[["Caída de objetos, volcamiento, golpes, atrapamiento","Respetar capacidad de racks, almacenar cargas pesadas abajo, asegurar estabilidad, no sobrepasar alturas permitidas"]]},{"etapa":"Registrar equipos, códigos, cantidades y ubicación","riesgos":[["Caídas, golpes contra estructuras, errores de identificación","Mantener orden, utilizar sistemas de registro, evitar trabajar en zonas de tránsito de equipos móviles"]]},{"etapa":"Seleccionar, embalar y preparar equipos para entrega","riesgos":[["Cortes, golpes, sobreesfuerzo, caída de materiales","Utilizar EPP, herramientas adecuadas, técnicas de levantamiento seguro y ayudas mecánicas"]]},{"etapa":"Cargar equipos a vehículos de transporte","riesgos":[["Caída de carga, atropello, atrapamiento, golpes","Delimitar zona de carga, aplicar procedimiento de carga, verificar estabilidad y amarre, mantener comunicación con el conductor/operador"]]},{"etapa":"Retirar embalajes, residuos y dejar área operativa","riesgos":[["Caídas, cortes, incendios, golpes","Segregar residuos, retirar materiales sobrantes, mantener vías de evacuación despejadas y realizar inspección final"]]}]},{"ref":"izaje"},{"ref":"grua"},{"ref":"admin"},{"ref":"aseo"}]},"calidad":{"titulo":"Análisis Seguro de Trabajo (AST) Calidad","bloques":[{"n":1,"etapas":[{"etapa":"Inspeccion de Calidad en Desarme:","riesgos":[["Caida de mismo nivel y distinto nivel","Mantener vias de evacuacion despejada, verificar las condiciones del terreno para la ejecucion de los trabajos."],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","No levantar carga mayor a 25 kg para trabajador hombre, solicitar ayuda mecanica en caso de sobrepasar el peso maximo de manipulacion (puete grua, carros, entre otros)"],["Golpes contra componentes o estructuras, atrapamiento de manos, caída de componentes o herramientas y exposición a equipos en proceso de desarme.","Coordinar previamente con el mecánico antes de ingresar al puesto. Mantener una distancia segura de componentes en manipulación. No ingresar a zonas de atrapamiento. Respetar las áreas delimitadas. Utilizar EPP definido para el área."],["Caída de objetos o componentes durante el proceso de desarme; golpes por movimiento inesperado de piezas.","No ubicarse bajo cargas suspendidas. Mantenerse fuera de la línea de fuego. Coordinar la inspección con el personal ejecutante y acercarse solo cuando el área se encuentre en condición segura."],["Atrapamiento, golpes o contacto con herramientas/equipos durante la toma de medidas realizada por el mecánico.","Mantener distancia segura durante la medición. No interferir con la operación del mecánico. Esperar que la pieza se encuentre estable antes de realizar la verificación."],["Caída o desplazamiento de componentes, posturas forzadas y contacto con superficies metálicas.","Verificar que el componente esté correctamente apoyado y asegurado. Utilizar instrumentos adecuados. Evitar posiciones inseguras y mantener orden en el puesto de trabajo."]]}]},{"n":2,"etapas":[{"etapa":"Ensayos No Destructivos (END)","riesgos":[["Exposición a productos químicos utilizados en END, radiación o equipos propios del ensayo, según técnica aplicada.","Mantener coordinación con el Inspector END. Respetar las áreas demarcadas y restricciones del proceso. Utilizar EPP correspondiente. No manipular productos o equipos de END sin autorización."],["Exposición a radiación ionizante, si se utiliza radiografía industrial; además de golpes, caídas o contacto con equipos.","Para END con radiacion UV, respetar estrictamente el área de exclusión y señalización; ingresar únicamente cuando el responsable del ensayo confirme condición segura. Para otras técnicas, respetar los controles específicos del método."],["Caida de mismo nivel y distinto nivel","Mantener vias de evacuacion despejada, verificar las condiciones del terreno para la ejecucion de los trabajos."],["Golpeado por y contra","Verificar que los lugares de trabajo esten ordenados, los bordes no sean filosos"]]}]},{"n":3,"etapas":[{"etapa":"Orden de materiales y equipos","riesgos":[["Caida de mismo nivel","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados."],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"],["Aplastamiento, atrapamiento","Utilizar todos los elementos de proteccion personal (EPP), planificar la actividad y verificar que los mesones esten en buenas condicines, revisar herramientas o equipos a utilizar"],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","No levantar carga mayor a 25 kg para trabajador hombre, solicitar ayuda mecanica en caso de sobrepasar el peso maximo de manipulacion (puete grua, carros, entre otros)"]]}]},{"ref":"admin"},{"n":5,"etapas":[{"etapa":"Revisión de juegos axiales y contacto entre dientes","riesgos":[["Atrapamiento de manos/dedos entre componentes, engranajes o partes móviles.","Coordinar con el mecánico antes de realizar la inspección. Asegurar que el equipo esté detenido y en condición segura. Mantener manos alejadas de puntos de atrapamiento y utilizar herramientas de medición adecuadas."],["Golpes, atrapamiento y posturas forzadas durante la medición.","Realizar medición con el componente estable. No introducir manos en puntos de pellizco. Mantener una postura segura y utilizar instrumentos adecuados."]]},{"etapa":"Revisión de prueba de estanqueidad","riesgos":[["Exposición a presión, proyección de fluidos o liberación inesperada de presión.","Mantenerse fuera de la línea de fuego. Verificar que la prueba esté correctamente instalada. No intervenir conexiones presurizadas. Mantener distancia segura durante la prueba y acercarse solo cuando sea autorizado."]]},{"etapa":"Toma de registros de prueba de estanqueidad","riesgos":[["Golpes, contacto con fluidos y liberación inesperada de presión.","Tomar registros desde una posición segura. No manipular conexiones durante la prueba. Utilizar EPP correspondiente al proceso."]]},{"etapa":"Liberacion de equipos","riesgos":[["Golpes, tropiezos, caída de objetos y contacto con componentes.","Coordinar el ingreso a la línea. Verificar que el área se encuentre despejada y segura. Mantener orden y aseo. No manipular componentes sin autorización."]]},{"etapa":"Pegado de adhesivos de indicaciones","riesgos":[["Caída al mismo nivel, posturas forzadas o golpes contra componentes.","Utilizar acceso seguro para alcanzar zonas elevadas. No subirse sobre componentes, estructuras o elementos improvisados. Mantener área despejada."]]}]},{"n":6,"etapas":[{"etapa":"(Machine Shop) Inspección de componentes trabajados en mandrinadora","riesgos":[["Atrapamiento con partes móviles, contacto con herramientas de corte, proyección de virutas y ruido.","Realizar inspección con la máquina detenida cuando corresponda. No acercarse a partes móviles. Mantener distancia de seguridad. Utilizar protección ocular y auditiva según condiciones del área."]]},{"etapa":"Inspector subiendo y midiendo piezas en la máquina","riesgos":[["Caída al mismo nivel, golpes, atrapamiento y contacto con virutas o bordes cortantes.","Utilizar accesos habilitados. Verificar que la máquina se encuentre detenida y en condición segura antes de acercarse. Utilizar guantes adecuados para manipulación de piezas, cuando corresponda."]]},{"etapa":"Inspección de piezas metalizadas","riesgos":[["Contacto con superficies calientes, humos o material residual del proceso.","El inspector no debe interactuar con piezas a elevada temperatura. Realizar la inspección únicamente cuando la pieza se encuentre a temperatura ambiente y el trabajo haya finalizado."]]},{"etapa":"Revisión de piezas recuperadas en torno","riesgos":[["Atrapamiento, cortes, contacto con partes móviles y proyección de virutas.","Realizar la inspección con el torno detenido. No acercarse a partes móviles. Verificar que la pieza esté estable antes de manipularla. Utilizar EPP definido para Machine Shop."]]}]},{"ref":"izaje"},{"n":8,"etapas":[{"etapa":"Aseo general","riesgos":[["Piso resbaladizo","Delimitar la zona de trabajo que este humedo para impedir el paso de personas no habilitadas, en caso de requerir trasladarse por la zona verificar el secado o proceder a secar"],["Caida de mismo nivel, Golpeado por y contra.","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados."],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario, no levantar craga mayor a 25 kg por trabajador hombre."],["Contacto con sustancias peligrosas","Verificar la compatibilidad antes de mezclar dos o mas productos, Utilizar los elementos de proteccion personal (EPP) guantes, zapatos de seguridad, ropa institucional, mantener los recipientes bien cerrados, correctamente almacenados, etiquetado y en lugares ventilados, tener la hoja de seguridad"]]},{"etapa":"Inspección previa de la grúa Horquilla","riesgos":[["Fallas mecánicas, hidráulicas o eléctricas; accidente por falla del equipo","Realizar inspección preoperacional; revisar frenos, dirección, neumáticos, horquillas, mástil, cadenas, luces, alarma de retroceso y fugas. Informar cualquier anomalía."]]},{"etapa":"Encendido y puesta en marcha","riesgos":[["Atropello, golpes, movimiento inesperado","Verificar que no existan personas u obstáculos alrededor; utilizar cinturón de seguridad y mantener las protecciones instaladas."]]},{"etapa":"Traslado sin carga","riesgos":[["Colisión, atropello, vuelco","Respetar límites de velocidad y señalización; mantener las horquillas bajas; conducir atento a peatones y condiciones del terreno."]]},{"etapa":"Traslado con carga","riesgos":[["Caída de carga, pérdida de estabilidad, vuelco","Asegurar correctamente la carga; no superar la capacidad máxima; mantener la carga baja y estable durante el desplazamiento."]]},{"etapa":"Elevación de carga","riesgos":[["Caída de materiales, vuelco, atrapamiento","No permanecer ni permitir personas bajo la carga elevada; elevar de manera gradual; respetar capacidad de carga y centro de gravedad."]]},{"etapa":"Circulación en áreas con peatones y retroceso","riesgos":[["Atropello, golpes, aplastamiento, colision","Respetar señalización; utilizar bocina en cruces y zonas de visibilidad reducida, Revisar el área antes de retroceder; utilizar alarma de retroceso y espejos; mantener velocidad controlada y contar con señalero cuando la visibilidad sea insuficiente."]]}]}]},"end":{"titulo":"Análisis Seguro de Trabajo (AST) Ensayos No Destructivos","bloques":[{"n":1,"etapas":[{"etapa":"Traslado del componente hasta el cuarto de ensayos (grúa horquilla, puente grúa o traslado manual, según tamaño y peso)","riesgos":[["Caida de mismo nivel y distinto nivel","Mantener vias de evacuacion despejada, verificar las condiciones del terreno para la ejecucion de los trabajos."],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","No levantar carga mayor a 25 kg para trabajador hombre, solicitar ayuda mecanica en caso de sobrepasar el peso maximo de manipulacion (puete grua, carros, entre otros)"],["Atrapamiento y Aplastamiento","Utilizar todos los elementos de proteccion personal (EPP), planificar la actividad y verificar que los mesones esten en buenas condicines, revisar herramientas o equipos a utilizar"],["Caída de carga suspendida","Si el traslado es con grúa apoyar componente en base estable dentro de la sala antes de manipular"],["Volcamiento o desplazamiento inesperado del componente durante su traslado. Posible caída de la carga, golpes y atrapamiento.","Antes de iniciar el traslado, verificar el estado y certificación vigente de los elementos de izaje, además de su capacidad de carga y correcta selección para la maniobra. Inspeccionar visualmente eslingas, grilletes, ganchos y demás accesorios. Asegurar correctamente el componente y verificar su estabilidad antes de elevarlo. Prohibir estrictamente el tránsito y permanencia de personas bajo cargas suspendidas. Delimitar y señalizar el área de maniobra."],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"]]},{"etapa":"Control de acceso y señalización del portón del cuarto de ensayos","riesgos":[["Ingreso de personal no autorizado durante aplicación de productos químicos o lectura UV Exposición de terceros a vapores o radiación UV","Letrero en el portón: \"Ensayo en curso — No ingresar sin autorización\" Mantener acceso restringido mientras se trabaja con productos o luz UV Coordinar con supervisor si el componente debe trasladarse excepcionalmente al taller"]]},{"etapa":"Ventilación de la sala de ensayos (sin extracción mecánica instalada — dispone de un portón como principal fuente de ventilación natural)","riesgos":[["Posible acumulación de vapores de solventes, penetrantes, removedores y reveladores en aerosol si el portón permanece cerrado durante la aplicación de productos aumento de la concentración de contaminantes en jornadas con varios ensayos seguidos y el portón cerrado","Mantener el portón abierto de forma permanente mientras se apliquen productos químicos (el portón permite buena renovación de aire natural) No aplicar más de un producto en aerosol de forma simultánea Cerrar los envases inmediatamente después de cada aplicación Ventilar el cuarto (abrir el portón) antes de reingresar tras cualquier lapso con este cerrado Confirmar con Prevención de Riesgos si la ventilación natural del portón es suficiente para los productos utilizados, o si conviene complementar con extracción localizada"]]},{"etapa":"Verificación y calibración de equipos (yugo, UT, medidor UV, luxómetro)","riesgos":[["Uso de equipo dañado o descalibrado Riesgo eléctrico por cables/conexiones en mal estado","Chequeo visual previo (cables, carcasa, conexión a tierra) Verificar certificado de calibración vigente No usar equipo con daño evidente — bloquear y reportar"]]},{"etapa":"Preparación de la superficie: limpieza y desengrase","riesgos":[["Exposición a solventes/desengrasantes (vapores, contacto con piel/ojos) Resbalones por derrame","Realizar con portón abierto Aplicación con paño, evitar rociado excesivo Limpiar derrames de inmediato Hoja de datos de seguridad (HDS) disponible en la sala"]]}]},{"n":2,"etapas":[{"etapa":"Inspección visual directa y con ayuda óptica (lupa, boroscopio, linterna)","riesgos":[["Caida de mismo nivel","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados."],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"],["Fatiga visual por iluminación deficiente Posturas forzadas al inspeccionar zonas de difícil acceso","Verificar nivel de iluminación mínimo requerido (luxómetro) Pausas visuales Usar plataforma/escabel si la altura del componente lo requiere"]]}]},{"n":3,"etapas":[{"etapa":"Aplicación de penetrante (aerosol o inmersión)","riesgos":[["Inflamabilidad (penetrante base solvente) cerca de fuentes de ignición","Aplicar en capa delgada y uniforme, evitar rociado excesivo"]]},{"etapa":"Aplicación de penetrante (aerosol o inmersión)","riesgos":[["inhalación de vapores de solvente y el contacto con piel/ojos, con sus controles asociados (portón abierto de forma permanente y prohibir fuentes de ignición).","Mantener el portón abierto de forma permanente durante la ejecución de la actividad para favorecer la ventilación natural. Utilizar los EPP definidos para la tarea, especialmente protección ocular/facial y guantes compatibles con el solvente utilizado. Mantener los envases cerrados cuando no estén en uso. Revisar la HDS del producto antes de utilizarlo. Prohibir estrictamente toda fuente de ignición en el área de trabajo, incluyendo fumar, llamas abiertas, trabajos en caliente, chispas y otras fuentes potenciales de ignición."]]},{"etapa":"Tiempo de penetración (espera)","riesgos":[["Exposición innecesaria a vapores por permanecer en la sala","Salir de la sala durante el tiempo de espera cuando sea posible, dejando el portón abierto para ventilar Delimitar y cronometrar según procedimiento"]]},{"etapa":"Remoción del exceso de penetrante","riesgos":[["Contacto con piel generación de residuos impregnados","Uso de paños desechables, remoción en una sola dirección disponer residuos en contenedor rotulado para residuos peligrosos"]]},{"etapa":"Aplicación de revelador (polvo seco o suspensión)","riesgos":[["Inhalación de polvo o aerosol del revelador (sin extracción mecánica en la sala)","Aplicar con portón abierto Aplicar en capa fina, mantener distancia de rociado recomendada"]]},{"etapa":"Interpretación de indicaciones (luz blanca o UV según tipo de penetrante)","riesgos":[["Fatiga visual Exposición a radiación UV si es penetrante fluorescente Acumulación de vapores si el cuarto permanece con el portón cerrado para oscurecer","Adaptación de la vista antes de leer Minimizar el tiempo con el portón cerrado; ventilar de inmediato al terminar la lectura Tiempo máximo de exposición a lámpara UV según procedimiento"]]},{"etapa":"Limpieza del componente tras la inspección con líquidos penetrantes (remoción del revelador)","riesgos":[["Contacto con piel al remover el revelador Generación de polvo si es revelador seco Residuo con trazas de penetrante","Remover con paño húmedo o lavado según tipo de revelador Recoger el residuo en contenedor rotulado para residuos peligrosos (contiene trazas de penetrante) Realizar con portón abierto si genera polvo"]]}]},{"n":4,"etapas":[{"etapa":"Particulas Magneticas (Magnetización con yugo electromagnético portátil)","riesgos":[["Riesgo eléctrico (contacto, cables dañados) Exposición a campos magnéticos","Inspección de cables y aislación antes de energizar No operar el equipo con manos húmedas o guantes mojados Verificar puesta a tierra del equipo"]]},{"etapa":"Aplicación de partículas magnéticas húmedas (aceite/agua con partículas, en aerosol)","riesgos":[["Inhalación del vehículo del baño, agravada por falta de extracción mecánica Contacto con piel y ojos Salpicaduras","Aplicación controlada, evitar exceso de producto Realizar con portón abierto"]]},{"etapa":"Inspección bajo luz UV en sala oscurecido (partículas húmedas fluorescentes)","riesgos":[["Exposición ocular/cutánea a radiación UV Tropiezos y golpes por ambiente con baja iluminación Acumulación de vapores/residuos del baño al cerrar el portón sin ventilación mecánica","Gafas con filtro UV, no exponer piel directamente a la lámpara Mantener el cuarto despejado de obstáculos Minimizar el tiempo con el portón cerrado y ventilar de inmediato al terminar la lectura Verificar intensidad UV con radiómetro según procedimiento"]]},{"etapa":"Limpieza del componente tras la inspección con partículas húmedas (remoción del baño residual)","riesgos":[["Contacto con piel/ojos por el residuo del baño (aceite o agua con partículas) Resbalones por goteo o derrame del componente mojado Generación de residuos húmedos","Limpiar con paño, papel absorbente o lavado según el vehículo del baño (agua o aceite) Recoger el residuo en bandeja o contenedor rotulado, evitar que escurra al piso Secar el componente antes de continuar con otro ensayo o liberarlo Realizar con portón abierto si el vehículo del baño contiene solvente"]]},{"etapa":"Aplicación de partículas magnéticas secas (polvo, con insuflador/dosificador)","riesgos":[["Inhalación de polvo fino, agravada por falta de extracción mecánica en el cuarto Dispersión de polvo en el ambiente Contacto con ojos","Aplicar con portón abierto Aplicar la cantidad mínima necesaria en nube ligera, evitar exceso No dirigir el chorro hacia el rostro"]]},{"etapa":"Inspección bajo luz visible (partículas secas)","riesgos":[["Fatiga visual por iluminación insuficiente","Verificar nivel de iluminación mínimo requerido (luxómetro)"]]},{"etapa":"Remoción de partículas secas tras la inspección","riesgos":[["Generación de polvo al remover con brocha o aire comprimido Proyección de partículas a los ojos si se usa aire comprimido","Preferir brocha suave o aspiradora sobre aire comprimido Si se usa aire comprimido, verificar presión reducida realizar con portón abierto"]]},{"etapa":"Desmagnetización de la pieza","riesgos":[["Campo magnético residual no detectado (afecta piezas/instrumentos posteriores)","Verificar desmagnetización con gaussímetro antes de liberar la pieza y epp basico"]]}]},{"n":5,"etapas":[{"etapa":"Ultra sonido (Aplicación de acoplante (gel o agua) y calibración con bloques patrón)","riesgos":[["Caida de mismo nivel","Utilizar todos los elementos de proteccion personal (EPP), verificar mediante check list el estado de la herramienta y notificar las deficiencias de estas."],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"],["Resbalones por derrame","Limpiar derrames de inmediato Verificar certificado de trazabilidad de los bloques antes de calibrar"]]},{"etapa":"Escaneo manual con palpador sobre el componente","riesgos":[["Posturas forzadas y movimientos repetitivos","Pausas y rotación de tareas Apoyar el componente a una altura de trabajo cómoda sobre banco o mesa"]]},{"etapa":"Limpieza del acoplante (gel) tras la inspección","riesgos":[["Oxidación/corrosión del componente si el acoplante no se retira, especialmente el de base acuosa Contacto con piel resbalones por derrame","Remover el acoplante con paño inmediatamente después del escaneo Verificar que no queden restos en zonas de difícil acceso (roscas, chaveteros) Secar el componente antes de liberarlo o continuar con otro ensayo"]]}]},{"n":6,"etapas":[{"etapa":"Cierre de actividad (Marcado de discontinuidades y registro de resultados)","riesgos":[["Contacto con marcadores/tinta permanente","Uso de marcador según procedimiento, evitar contacto directo prolongado con la piel"]]},{"etapa":"Limpieza final del componente y disposición de residuos","riesgos":[["Contacto con residuos peligrosos (solventes, partículas, penetrantes)","Disponer en contenedores rotulados según clasificación de residuos peligrosos de la planta No verter residuos en desagües"]]},{"etapa":"Retiro de EPP y aseo general","riesgos":[["Contaminación cruzada (residuos de producto en manos/rostro)","Lavado de manos y rostro con agua y jabón antes de comer o retirarse del área Cambio de ropa de trabajo si hubo contacto significativo con producto"]]}]}]},"inspeccion":{"titulo":"Análisis Seguro de Trabajo (AST) Inspector Tecnico","bloques":[{"n":1,"etapas":[{"etapa":"Planificación de la inspección","riesgos":[["Exposición a condiciones inseguras, falta de información, ingreso a áreas restringidas","Revisar previamente alcance y procedimiento de inspección; coordinar ingreso con responsables del área; realizar AST cuando corresponda; utilizar EPP definido."]]},{"etapa":"Traslado hacia el área de inspección","riesgos":[["Caídas al mismo nivel, golpes, atropello, interacción con equipos móviles.","Utilizar vías peatonales habilitadas; respetar señalización; mantener atención al entorno; utilizar chaleco reflectante en áreas con tránsito vehicular"]]},{"etapa":"Ingreso y reconocimiento del área","riesgos":[["Caídas, golpes, exposición a maquinaria, ruido, polvo o sustancias peligrosas","Realizar inspección visual del entorno antes de ingresar; identificar peligros del área; mantener distancia de equipos en operación; utilizar EPP específico según las condiciones"]]},{"etapa":"Inspección visual del equipo","riesgos":[["Golpes, cortes, atrapamiento, contacto con superficies calientes o partes móviles","No intervenir equipos en movimiento; mantener distancias de seguridad; utilizar guantes y protección ocular cuando corresponda; verificar que el equipo se encuentre en condición segura para inspección"]]},{"etapa":"Revisión de componentes y accesorios","riesgos":[["Atrapamiento, golpes, cortes, caída de objetos","Utilizar herramientas adecuadas; verificar previamente la condición del equipo; asegurar componentes sueltos; no retirar protecciones sin autorización y aplicar bloqueo cuando corresponda"]]},{"etapa":"Inspección de equipos en altura","riesgos":[["Caída a distinto nivel, caída de herramientas o materiales","Utilizar plataformas, andamios o medios de acceso autorizados; aplicar sistema de protección contra caídas cuando exista exposición; delimitar el área inferior; asegurar herramientas"]]},{"etapa":"Inspección de equipos energizados","riesgos":[["Contacto eléctrico, arco eléctrico, quemaduras, atrapamiento","Evitar intervenir equipos energizados cuando no sea necesario; aplicar bloqueo y etiquetado cuando corresponda; mantener distancias de seguridad; utilizar personal autorizado y EPP específico para riesgo eléctrico"]]},{"etapa":"Realización de mediciones y pruebas","riesgos":[["Contacto con partes móviles, energía eléctrica, proyección de partículas, ruido","Utilizar instrumentos adecuados y en buen estado; verificar calibración; seguir procedimiento de prueba; mantener protecciones instaladas; utilizar EPP correspondiente"]]},{"etapa":"Inspección mediante herramientas manuales","riesgos":[["Cortes, golpes, atrapamiento, proyección de partículas","Inspeccionar herramientas antes de utilizarlas; seleccionar la herramienta adecuada; utilizar guantes y lentes de seguridad; mantener herramientas en buenas condiciones"]]},{"etapa":"Registro de hallazgos y evidencias","riesgos":[["Caídas, distracción durante desplazamiento, ingreso a zonas peligrosas para obtener fotografías","Registrar información desde zonas seguras; no exponerse innecesariamente para obtener fotografías; mantener atención al entorno; utilizar dispositivos de registro de manera segura"]]},{"etapa":"Comunicación de observaciones y desviaciones","riesgos":[["Exposición a conflictos, permanencia en áreas de riesgo","Informar hallazgos de manera objetiva y conforme al procedimiento; evitar discusiones en áreas operativas; realizar reuniones en lugares seguros y habilitados"]]},{"etapa":"Elaboración del informe técnico","riesgos":[["Errores u omisiones en la información, interpretación incorrecta de resultados","Revisar antecedentes y registros antes de emitir el informe; utilizar formatos establecidos; respaldar observaciones con evidencias; realizar revisión técnica antes de su entrega"]]},{"etapa":"Seguimiento de observaciones","riesgos":[["Exposición a condiciones inseguras durante reinspecciones","Coordinar previamente las visitas; verificar que las condiciones de trabajo sean seguras; realizar seguimiento documental y en terreno según procedimiento"]]},{"etapa":"Cierre de la inspección","riesgos":[["Caídas, golpes, atropello durante el retiro del área","Retirarse por rutas habilitadas; verificar que no queden herramientas o elementos en el área; respetar señalización y mantener comunicación con el responsable del área"]]}]},{"ref":"izaje"},{"ref":"admin"},{"n":4,"etapas":[{"etapa":"Carga y descarga material","riesgos":[["Caida de mismo nivel y distinto nivel","Mantener vias de evacuacion despejada, verificar las condiciones del terreno para la ejecucion de los trabajos."],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","No levantar carga mayor a 25 kg para trabajador hombre, solicitar ayuda mecanica en caso de sobrepasar el peso maximo de manipulacion (puete grua, carros, entre otros)"],["Atrapamiento y Aplastamiento","Utilizar todos los elementos de proteccion personal (EPP), planificar la actividad y verificar que los mesones esten en buenas condicines, revisar herramientas o equipos a utilizar"],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"]]}]},{"ref":"grua"},{"n":6,"etapas":[{"etapa":"Inspección del vehículo antes de iniciar el viaje","riesgos":[["Fallas mecánicas, accidentes por desperfectos del vehículo","Realizar inspección preoperacional; verificar neumáticos, frenos, luces, cinturones, niveles y elementos de seguridad; informar y corregir cualquier desperfecto antes de utilizar el vehículo"]]},{"etapa":"Ascenso y descenso del vehículo","riesgos":[["Caídas al mismo nivel, golpes, atrapamiento de manos o pies","Utilizar accesos habilitados; subir y bajar con precaución; verificar que el vehículo se encuentre detenido y en un lugar seguro; mantener tres puntos de apoyo cuando corresponda"]]},{"etapa":"Conducción hacia el lugar de inspección","riesgos":[["Colisión, volcamiento, atropello, distracción, fatiga","Respetar límites de velocidad y normativa de tránsito; utilizar cinturón de seguridad; mantener distancia prudente; conducir atento y sin utilizar teléfono celular; realizar pausas en trayectos prolongados"]]},{"etapa":"Transporte de herramientas y equipos de inspección","riesgos":[["Golpes, caída de objetos, proyección de elementos durante una frenada","Transportar herramientas y equipos correctamente asegurados; utilizar maletero o compartimientos destinados para carga; evitar objetos sueltos dentro del habitáculo"]]},{"etapa":"Conducción dentro de instalaciones industriales","riesgos":[["Atropello, colisión con maquinaria, equipos móviles o estructuras","Respetar límites de velocidad internos; utilizar rutas autorizadas; mantener distancia de equipos móviles; respetar señalización y coordinación con personal del área"]]},{"etapa":"Estacionamiento en zona de inspección","riesgos":[["Atropello, golpes, caída al descender, interacción con otros vehículos","Estacionar en lugares autorizados y seguros; aplicar freno de estacionamiento; apagar el motor cuando corresponda; utilizar balizas/señalización según las condiciones del lugar"]]},{"etapa":"Descarga de herramientas y equipos","riesgos":[["Sobreesfuerzo, golpes, cortes, caída de materiales","Evaluar peso antes de manipular; utilizar técnicas de levantamiento seguro; emplear ayudas mecánicas cuando corresponda; mantener ordenada el área de descarga"]]},{"etapa":"Retorno y cierre del traslado","riesgos":[["Accidentes de tránsito, fatiga, pérdida de concentración","Verificar condiciones del vehículo antes del retorno; asegurar nuevamente la carga; conducir de manera defensiva; realizar pausas cuando sea necesario; informar cualquier incidente o desperfecto"]]}]},{"n":7,"etapas":[{"etapa":"Inspección del área de trabajo","riesgos":[["Caída a distinto nivel, golpes, contacto con obstáculos, caída de objetos.","Inspeccionar el área antes de comenzar; identificar bordes, desniveles, aberturas y obstáculos; delimitar y señalizar el área inferior."]]},{"etapa":"Inspección de equipos y sistema anticaídas","riesgos":[["Falla del equipo, caída de altura por uso de elementos defectuosos","Inspeccionar arnés, líneas de vida, conectores, absorbedores y puntos de anclaje antes de cada uso; retirar inmediatamente equipos dañados; verificar compatibilidad y certificación de los sistemas."]]},{"etapa":"Instalación de sistema de protección contra caídas","riesgos":[["Caída durante la instalación, golpes, atrapamiento.","Utilizar sistemas de protección adecuados; instalar puntos de anclaje y líneas de vida según especificaciones; mantener conexión al sistema anticaídas cuando exista exposición a caída."]]},{"etapa":"Ejecución del trabajo en altura","riesgos":[["Caída de trabajador, caída de herramientas/materiales, golpes y atrapamientos.","Utilizar arnés de cuerpo completo y sistema anticaídas apropiado; permanecer conectado a un punto de anclaje seguro; mantener superficie de trabajo estable; utilizar porta herramientas y asegurar elementos que puedan caer."]]},{"etapa":"Manipulación de herramientas y materiales","riesgos":[["Caída de objetos, golpes a trabajadores ubicados en niveles inferiores, sobreesfuerzo.","Amarrar herramientas cuando exista riesgo de caída; utilizar sistemas de izaje para materiales; prohibir el lanzamiento de objetos; mantener el área inferior segregada."]]},{"etapa":"Trabajo con escaleras","riesgos":[["Caída, volcamiento, deslizamiento, sobrealcance.","Utilizar escaleras en buen estado; instalar sobre superficie firme y estable; asegurar cuando corresponda; mantener tres puntos de apoyo; no trabajar desde peldaños no autorizados ni realizar sobrealcances."]]},{"etapa":"Trabajo sobre andamios/plataformas","riesgos":[["Caída desde plataforma, volcamiento, caída de objetos.","Utilizar andamios/plataformas correctamente instalados e inspeccionados; contar con barandas y rodapiés cuando corresponda; mantener acceso seguro; no modificar estructuras sin autorización."]]},{"etapa":"Descenso y término de la actividad","riesgos":[["Caída durante el descenso, caída de herramientas, golpes.","Mantener el sistema de protección contra caídas hasta encontrarse en zona segura; retirar materiales de forma controlada; bajar herramientas mediante sistemas adecuados; realizar inspección final del área."]]}]},{"ref":"aseo"}]},"pintura":{"titulo":"Análisis Seguro de Trabajo (AST) Pintura","bloques":[{"n":1,"etapas":[{"etapa":"Recepción y traslado de equipos, partes y piezas","riesgos":[["Golpes, atrapamiento, caída de materiales, sobreesfuerzo, tránsito de equipos móviles.","Delimitar el área de trabajo, utilizar medios mecánicos para cargas pesadas, mantener vías despejadas, aplicar técnicas de manipulación manual y utilizar EPP correspondiente."],["Manejo de peso excesivo (mayor a 25 kg por trabajador hombre)","No levantar carga mayor a 25 kg para trabajador hombre, solicitar ayuda mecanica en caso de sobrepasar el peso maximo de manipulacion (puete grua, carros, entre otros)"],["Caída de objetos o componentes durante el proceso de desarme; golpes por movimiento inesperado de piezas.","Realizar inspección previa del área antes de iniciar el ensayo. Verificar que el piso se encuentre limpio, seco y despejado. Eliminar o controlar inmediatamente manchas de aceite y obstáculos. Mantener vías de circulación despejadas y condiciones de orden y aseo"]]},{"etapa":"Inspección y preparación del área de trabajo","riesgos":[["Caídas al mismo nivel, golpes, contacto con superficies contaminadas, exposición a sustancias químicas.","Mantener orden y aseo, verificar condiciones del área, retirar obstáculos, disponer de ventilación adecuada y revisar las HDS de los productos químicos."]]}]},{"n":2,"etapas":[{"etapa":"Limpieza y desengrase de superficies","riesgos":[["Contacto con productos químicos, inhalación de vapores, salpicaduras a ojos y piel, incendio por productos inflamables.","Utilizar guantes resistentes a químicos, protección ocular/facial y respiratoria según HDS; asegurar ventilación, mantener fuentes de ignición alejadas y disponer de kit para derrames."],["Caida de mismo nivel y distinto nivel","Mantener vias de evacuacion despejada, verificar las condiciones del terreno para la ejecucion de los trabajos."],["Golpeado por y contra","Verificar que los lugares de trabajo esten ordenados, los bordes no sean filosos"]]},{"etapa":"Preparación mecánica de superficies (lijado, esmerilado, etc.)","riesgos":[["Proyección de partículas, polvo, ruido, vibraciones, cortes, atrapamiento y riesgo eléctrico.","Usar protección ocular/facial, protección auditiva y respiratoria adecuada; verificar herramientas y cables, instalar guardas, utilizar extracción de polvo cuando corresponda y mantener una postura de trabajo segura"]]}]},{"n":3,"etapas":[{"etapa":"Preparación y mezcla de pintura, diluyentes y otros productos","riesgos":[["Caida de mismo nivel","Verificar vias de transito despejadas no obstruidas y no humedesidas, en caso de estar señalizar debidamente, utilizar zapatos de seguridad adecuados."],["Golpeado por y contra","Mantener el orden y limpieza del lugar de trabajo, guardar las herramientas en los lugares correspondientes, señalizar en caso de ser necesario"],["Inhalación de vapores, contacto químico, salpicaduras, incendio/explosión, derrames.","Revisar HDS, trabajar en zona ventilada, mantener productos cerrados cuando no se utilicen, eliminar fuentes de ignición, utilizar EPP químico y preparar solo las cantidades necesarias."]]},{"etapa":"Aplicación de pintura (brocha, rodillo o pistola)","riesgos":[["Exposición a vapores y aerosoles, contacto con sustancias químicas, proyección de pintura, incendio/explosión, sobreesfuerzo","Utilizar protección respiratoria compatible con el producto, guantes, protección ocular y ropa de protección; asegurar ventilación/extracción, controlar fuentes de ignición y delimitar el área para evitar el ingreso de personal no autorizado."]]}]},{"n":4,"etapas":[{"etapa":"Pintura en altura, cuando corresponda","riesgos":[["Caída de altura, caída de herramientas o materiales, pérdida de equilibrio","Utilizar plataformas o andamios adecuados y certificados; implementar protección contra caídas según corresponda, asegurar herramientas y delimitar el área inferior"]]},{"etapa":"Secado y curado de pintura","riesgos":[["Inhalación de vapores, incendio, contacto con superficies húmedas, contaminación de otras áreas.","Mantener ventilación adecuada, respetar tiempos de secado indicados por el fabricante, prohibir fuentes de ignición y restringir el acceso al área hasta que sea seguro."]]},{"etapa":"Limpieza de herramientas y equipos","riesgos":[["Contacto con solventes, inhalación de vapores, incendio, derrames y generación de residuos peligrosos.","Realizar limpieza en área ventilada, utilizar EPP indicado en HDS, mantener recipientes cerrados y disponer los residuos y paños contaminados en contenedores adecuados."]]},{"etapa":"Retiro de residuos y orden del área","riesgos":[["Contacto con residuos químicos, cortes, tropiezos, derrames y contaminación ambiental.","Segregar y disponer los residuos según su clasificación, utilizar guantes y protección adecuada, mantener el área limpia y verificar que no queden productos o materiales inflamables expuestos."]]}]},{"ref":"izaje"},{"ref":"grua"},{"ref":"aseo"}]},"desarme":{"titulo":"Análisis Seguro de Trabajo (AST) Desarme y Evaluación","bloques":[{"n":1,"etapas":[{"etapa":"Lavado de equipos y piezas","r
