<style>
/* ================= IDENTIDAD SM CYCLO / SUMITOMO DRIVE ================= */
:root{
  --ink:#0A2540; --ink-2:#33475B; --ink-3:#6B7C8C;
  --paper:#EDF1F5; --card:#FFFFFF; --line:#D5DEE6;
  --sumi:#0B4EA2;      /* azul corporativo */
  --cian:#00A0DF;      /* acento */
  --acero:#5B6B7A;
  --rojo:#C62828; --verde:#1B7F3B; --ambar:#E08A00; --gris:#6B7C8C;
  --c1:#0B4EA2; --c2:#0089C7; --c3:#0E8A6E; --c4:#C8791A; --c5:#B33B3B; --c6:#5B3E8A; --c7:#1B7F3B;
  --biselL:inset 0 1px 0 rgba(255,255,255,.95);
  --biselD:inset 0 -1px 0 rgba(10,37,64,.07);
  --r:12px; --sh:0 1px 2px rgba(10,37,64,.08), 0 8px 22px rgba(10,37,64,.07);
  --f-disp: ui-sans-serif, "Segoe UI Semibold", "Helvetica Neue", Arial, sans-serif;
  --f-body: ui-sans-serif, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--f-body);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:120px;
  background:linear-gradient(180deg,#E9EFF6 0%,#EDF1F5 40%,#E6ECF3 100%);min-height:100vh}
.wrap,.bar-fija,.modo{position:relative;z-index:1}

/* franja de peligro industrial */
.hazard{height:12px;width:100%;background:repeating-linear-gradient(135deg,var(--c) 0 13px,#FFFFFF 13px 26px);--c:var(--rojo)}
#top{position:fixed;top:0;left:0;right:0;z-index:20;transform:translateZ(0);
  will-change:transform;backface-visibility:hidden}
@media (min-width:920px){ #top{left:250px} }
#espacio{height:150px}
/* la franja de peligro es siempre roja y blanca; el estado se lee en la placa */

header{position:relative;overflow:hidden;padding:13px 16px 15px;color:#fff;
  background:linear-gradient(135deg,#0A2540 0%,#0B3A73 58%,#0B4EA2 100%)}
header.compact{padding:9px 16px 10px}
#top.compact{box-shadow:0 8px 22px rgba(10,37,64,.28)}
header.compact .brand,header.compact .h-meta,header.compact .quien{display:none}
header.compact .h-area{font-size:17px;line-height:1.2;margin-top:0;gap:9px}
header.compact .h-nav{margin-top:0;margin-bottom:1px}
header.compact .llave,header.compact .menu-btn{top:7px;height:34px}
header::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;z-index:2;
  background:linear-gradient(90deg,var(--cian),rgba(0,160,223,.25) 55%,transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.18)}
.gloss{display:none}
.deco{position:absolute;right:-10px;bottom:-26px;width:190px;height:143px;pointer-events:none;z-index:0;
  fill:none;stroke:#FFFFFF;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;opacity:.17}
.deco .d2{stroke:#00A0DF;opacity:.85}
.deco .d3{stroke-width:2.2;opacity:.8}
@media (max-width:520px){ .deco{width:150px;height:113px;right:-16px;bottom:-22px;opacity:.13} }
header.compact .deco{display:none}
@keyframes giro{to{transform:rotate(360deg)}}
.brand{position:relative;font:600 10.5px/1.3 var(--f-disp);letter-spacing:.15em;text-transform:uppercase;color:#9EC3E8}
.brand,.h-nav,.h-area,.h-meta,.quien{padding-right:118px}
@media (min-width:920px){ .brand,.h-nav,.h-area,.h-meta,.quien{padding-right:66px} }
.h-nav{position:relative;font-size:12.5px;color:#9EC3E8;margin-top:6px}
.h-nav span{cursor:pointer;text-decoration:underline}
.h-area{position:relative;font:800 24px/1.14 var(--f-disp);letter-spacing:-.015em;margin-top:5px;
  overflow-wrap:anywhere;display:flex;align-items:center;gap:11px}
.emb-box{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.emb{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.emb .ok{stroke:#00A0DF;stroke-width:3.4}
header.compact .emb-box{width:34px;height:34px;border-radius:10px}
header.compact .emb{width:23px;height:23px}
.h-meta{position:relative;font-size:12.5px;color:#A9C6E2;margin-top:4px;font-variant-numeric:tabular-nums}
.quien{position:relative;margin-top:9px;font-size:12.5px;color:#CFE1F1;cursor:pointer}
.quien b{color:#fff} .quien u{color:#9EC3E8;margin-left:6px}

.wrap{max-width:860px;margin:0 auto;padding:14px}
.card{position:relative;background:linear-gradient(180deg,#FFFFFF 0%,#F8FAFD 100%);
  border:1px solid var(--line);border-radius:14px;padding:17px 16px 16px;margin-bottom:13px;overflow:hidden;
  box-shadow:var(--biselL),var(--biselD),0 1px 2px rgba(10,37,64,.07),0 10px 26px rgba(10,37,64,.07)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--ac,var(--sumi)) 0%,color-mix(in srgb,var(--ac,var(--sumi)) 55%,var(--cian)) 42%,transparent 92%);
  box-shadow:0 1px 0 rgba(255,255,255,.6)}
.card.sec1{--ac:var(--c1)} .card.sec2{--ac:var(--c2)} .card.sec3{--ac:var(--c3)}
.card.sec4{--ac:var(--c4)} .card.sec5{--ac:var(--c5)} .card.sec6{--ac:var(--c6)} .card.sec7{--ac:var(--c7)}
.bdg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;
  margin-right:9px;font:800 11px/1 var(--f-disp);color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac,var(--sumi)) 82%,#fff),var(--ac,var(--sumi)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(10,37,64,.28)}
.card h2{font:700 12px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ac,var(--sumi));align-items:center;
  margin:2px 0 12px;padding-bottom:9px;border-bottom:1px solid #E4EBF2;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sub-h{font:700 11px/1.2 var(--f-disp);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);
  margin:0 0 9px;padding-left:11px;border-left:3px solid var(--ac,var(--sumi));display:flex;
  justify-content:space-between;gap:10px;align-items:baseline}
.sub-h .cnt{font:600 11px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.card h2 .edit{margin-left:auto;font:700 10.5px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:linear-gradient(180deg,#1A66C0,#0B4EA2);padding:6px 10px;border-radius:7px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 3px rgba(10,37,64,.25)}
.card h2 .edit:active{transform:translateY(1px)}
.card h2 .cnt{font:600 11px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-3)}

/* placa de estado */
.placa{display:flex;align-items:center;gap:14px;border-radius:13px;padding:16px;color:#fff;background:var(--gris);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -3px 0 rgba(0,0,0,.16),0 6px 18px rgba(10,37,64,.18);
  text-shadow:0 1px 2px rgba(0,0,0,.24)}
.placa.pendiente{background:linear-gradient(180deg,#D93A3A,#B71F1F)}
.placa.firmada{background:linear-gradient(180deg,#22A051,#146B31)}
.placa.borrador{background:linear-gradient(180deg,#F0A21E,#CE7A00)}
.placa.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.placa.click:hover{transform:translateY(-1px)}
.placa.click:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.28)}
.placa .ir{position:relative;margin-left:auto;font:700 30px/1 var(--f-disp);opacity:.9;padding-left:10px}
.placa.archivada{background:linear-gradient(180deg,#6E8091,#4E5F6E)}
.placa.vencida,.placa.ninguna,.placa.anulada{background:linear-gradient(180deg,#7D8D9B,#5A6B79)}
.placa{position:relative;overflow:hidden}
.placa::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 55%)}
.placa .lamp{position:relative;width:38px;height:38px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%,#fff,#E6EEF4 58%,#BECBD6);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.2),inset 0 -2px 4px rgba(0,0,0,.18),0 0 0 4px rgba(255,255,255,.16),0 0 16px rgba(255,255,255,.35)}
.placa>div:last-child{position:relative}
.placa .t1{font:800 18px/1.1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase}
.placa .t2{font-size:12.5px;opacity:.93;margin-top:3px}

label{display:block;font:600 10.5px/1.2 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:13px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #C8D4DF;border-radius:10px;
  background:linear-gradient(180deg,#F7F9FC,#FFFFFF 42%);color:var(--ink);
  box-shadow:inset 0 2px 3px rgba(10,37,64,.07),inset 0 -1px 0 rgba(255,255,255,.9)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sumi);

textarea{min-height:74px;resize:vertical}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;

input[type="time"]::-webkit-date-and-time-value{text-align:left;margin:0}

input[type="time"]::-webkit-calendar-picker-indicator{margin-left:2px;padding:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0;max-width:100%}
.row>div>input,.row>div>select{min-width:0}
@media (max-width:400px){ .row{gap:8px} .row>*{flex:1 1 100%} }

button{font:700 15px/1 var(--f-disp);border:0;border-radius:11px;padding:14px 16px;

  letter-spacing:.015em;text-shadow:0 1px 1px rgba(0,0,0,.22);

button:active{transform:translateY(1.5px);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 1px 2px rgba(10,37,64,.18)}
button.sec{background:linear-gradient(180deg,#FFFFFF,#EFF3F8);color:var(--ink);border:1px solid #C8D4DF;text-shadow:none;
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(10,37,64,.05),0 1px 3px rgba(10,37,64,.12)}
button.ok{background:linear-gradient(180deg,#2AA353 0%,#1B7F3B 52%,#166B32 100%)}
button.dan{background:linear-gradient(180deg,#DB3A3A 0%,#C62828 52%,#A82121 100%)}
button.sm{padding:9px 12px;font-size:13px;width:auto;margin:0}

/* ---- selección tipo formulario (EPP / equipos) ---- */
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
@media (max-width:700px){ .pills{grid-template-columns:1fr 1fr;gap:7px} }
@media (max-width:340px){ .pills{grid-template-columns:1fr} }
.pill{display:flex;align-items:flex-start;gap:8px;border:1px solid #CDD9E3;

  line-height:1.28;cursor:pointer;min-height:48px;transition:all .13s;overflow-wrap:anywhere;
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(10,37,64,.07)}
@media (min-width:701px){ .pill{font-size:13.5px;padding:11px 12px;align-items:center} }
.pill:hover{border-color:#A9BCCD;transform:translateY(-1px);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(10,37,64,.12)}
.pill .bx{width:18px;height:18px;margin-top:1px;border:1.7px solid #A9B7C4;border-radius:6px;flex:none;position:relative;
  background:linear-gradient(180deg,#F7F9FC,#fff);box-shadow:inset 0 1px 2px rgba(10,37,64,.12)}
.pill.on{border-color:var(--sumi);color:#0A3E80;font-weight:600;
  background:linear-gradient(180deg,#F0F6FE,#DDE9FA);
  box-shadow:inset 0 0 0 1px rgba(11,78,162,.55),inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(11,78,162,.16)}
.pill.on .bx{background:linear-gradient(180deg,#2A6FC4,#0B4EA2);border-color:#0A4590;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(10,37,64,.3)}
.pill.on .bx::after{content:"";position:absolute;left:5.5px;top:1.5px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.pill.ro{cursor:default}
.pill.otro{background:linear-gradient(180deg,#F0FAF4,#DDF2E5);border-color:#57A877;color:#166534;
  box-shadow:inset 0 0 0 1px rgba(27,127,59,.45),inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(27,127,59,.14)}
.pill.otro .bx{background:linear-gradient(180deg,#2FA35A,#1B7F3B);border-color:#177034;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pill .x{margin-left:auto;padding-left:9px;color:var(--rojo);font-size:17px;line-height:1;cursor:pointer}

.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:23px;height:23px;flex:none;margin-top:2px;accent-color:var(--sumi)}
.chk span{font-size:14.5px}

.preg{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.preg:last-child{border-bottom:0}
.preg .txt{flex:1;font-size:14px;line-height:1.35}
.preg select{width:92px;flex:none;padding:9px}

/* ---- paso 5 ---- */
.bloque{border:1px solid #CFDAE4;border-radius:12px;margin-bottom:13px;overflow:hidden;background:#fff;
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(10,37,64,.07),0 6px 16px rgba(10,37,64,.06)}
.bl-h{background:linear-gradient(180deg,#F7FAFD,#E9EFF6);border-bottom:1px solid #CFDAE4;padding:11px 13px;
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(10,37,64,.05);
  font:700 10.5px/1.2 var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--sumi);
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.bl-h .c{font:600 10.5px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.et{border-bottom:1px solid var(--line)}
.et:last-child{border-bottom:0}
.et-h{display:flex;gap:11px;align-items:center;padding:12px 13px;border-top:1px solid #EEF3F8;
  background:linear-gradient(180deg,#FDFEFF,#F4F8FB);box-shadow:inset 0 1px 0 #fff}
.et-h input{width:21px;height:21px;flex:none;accent-color:var(--sumi)}
.et-n{font:700 14.5px/1.3 var(--f-disp);flex:1}
.et-c{font:700 10.5px/1 var(--f-disp);color:var(--ink-3);white-space:nowrap;background:#EDF2F7;
  border:1px solid #DBE4EC;border-radius:99px;padding:5px 9px;box-shadow:inset 0 1px 0 #fff}
.rg{padding:0 13px 4px 13px}
.rk{display:flex;gap:11px;padding:11px 0;border-top:1px dashed #DCE6EF;cursor:pointer;
  border-radius:8px;transition:background .12s}
.rk:hover{background:#F7FAFD}
.rk input{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--sumi)}
.rk .r{font-size:13.5px;line-height:1.35;color:var(--ink)}
.rk .m{font-size:12.5px;line-height:1.4;color:var(--ink-3);margin-top:3px;
  padding-left:9px;border-left:2px solid #DCE6EF}
.rk .k{font:700 9.5px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--sumi);margin-right:5px}
.rk .k.c{color:var(--verde)}

.paso{border:1px solid var(--line);border-left:4px solid var(--ac,var(--sumi));border-radius:9px;padding:12px;margin-bottom:9px;background:linear-gradient(180deg,#FBFCFE,#F6F9FC)}
.paso .n{font:800 10.5px/1 var(--f-disp);letter-spacing:.12em;color:var(--sumi)}
.paso p{margin:5px 0 0;font-size:14px}
.paso .med{color:var(--ink-2);font-size:13.5px}
.paso .k,.rk .k{font:700 9.5px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--sumi);margin-right:6px}
.paso .k.c,.rk .k.c{color:var(--verde)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font:700 10px/1.2 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;
  padding:9px 8px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#F7FAFC,#EFF4F8)}
table{border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px #E4EBF2}
td{padding:10px 8px}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}

canvas.pad{width:100%;height:158px;border:1.5px dashed #A9B7C4;border-radius:11px;touch-action:none;display:block;
  background:linear-gradient(180deg,#FCFDFE,#F5F8FB);box-shadow:inset 0 2px 6px rgba(10,37,64,.07)}
.firma-ok{border:1px solid var(--line);border-radius:9px;padding:8px;background:#F7FAFC}

/* ---- mosaicos de área ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.tile{position:relative;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--acbg,#EAF2FC) 0%,#FFFFFF 46%,#FFFFFF 100%);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;min-height:150px;
  transition:transform .12s,box-shadow .12s,border-color .12s}
.tile{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(10,37,64,.08),0 10px 24px rgba(10,37,64,.09)}
@media (hover:none){.tile:hover{transform:none}}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(150deg,rgba(255,255,255,.6),transparent 42%)}
.tile:hover{transform:translateY(-3px);border-color:#B4C6D6;
  box-shadow:inset 0 1px 0 #fff,0 4px 8px rgba(10,37,64,.10),0 18px 38px rgba(10,37,64,.16)}
.tile:active{transform:translateY(0)}
.tile .bar{height:6px;background:var(--ac,var(--sumi));
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.35)}
.tile .in{padding:12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ico{position:relative;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#FFFFFF,var(--acbg,#EAF2FC));margin-bottom:10px;
  box-shadow:inset 0 0 0 1px var(--acbd,#DCE6F2),inset 0 1px 0 #fff,0 2px 6px rgba(10,37,64,.10)}
.tile .ico svg{width:24px;height:24px;stroke:var(--ac,var(--sumi));fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:700 15px/1.22 var(--f-disp);letter-spacing:-.01em}
.tile small{display:block;color:var(--ink-3);font-size:11.5px}
.tile .prog{height:7px;border-radius:99px;background:#E4EBF2;overflow:hidden;margin-top:auto;
  box-shadow:inset 0 1px 2px rgba(10,37,64,.16)}
.tile .prog i{display:block;height:100%;border-radius:99px;transition:width .35s;
  background:linear-gradient(180deg,#3CB169,#1B7F3B);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tile .pin{position:absolute;top:10px;right:10px;background:var(--rojo);box-shadow:0 2px 8px rgba(198,40,40,.4);color:#fff;font:700 10.5px/1 var(--f-disp);
  padding:5px 7px;border-radius:99px}
.tile .est{font:700 10.5px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ac,var(--sumi))}

.item{border:1px solid #D3DEE8;border-left:5px solid var(--gris);border-radius:11px;padding:13px;margin-bottom:10px;cursor:pointer;
  background:linear-gradient(180deg,#fff,#F7FAFC);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(10,37,64,.08);transition:all .13s}
.item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(10,37,64,.13)}
.item b{font:700 14.5px/1.2 var(--f-disp)}
.traza{padding:10px 0;border-bottom:1px solid var(--line)}
.traza:last-child{border-bottom:0}
.traza .t-a{font-size:14.5px;line-height:1.35}
.traza .mini{margin-top:2px}

.bar-fija{position:fixed;left:0;right:0;bottom:0;border-top:1px solid #C8D4DF;
  background:linear-gradient(180deg,#FFFFFF,#F0F4F9);
  box-shadow:inset 0 1px 0 #fff,0 -6px 22px rgba(10,37,64,.10);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;z-index:9;
}
.bar-fija button{margin:0;flex:1 1 44%;min-width:0;padding:13px 8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msg{padding:12px 13px;border-radius:10px;font-size:14px;margin-bottom:11px}
.msg.i{background:linear-gradient(180deg,#F1F7FE,#E1ECFA);color:#0A3E80;border:1px solid #C3D8F0;box-shadow:inset 0 1px 0 #fff}
.msg.e{background:linear-gradient(180deg,#FEF2F2,#FBDFDF);color:#9E1F1F;border:1px solid #F0C4C4;box-shadow:inset 0 1px 0 #fff}
.mini{font-size:12.5px;color:var(--ink-3)}
.cola{position:relative;z-index:1;background:#FDECEC;border-bottom:1px solid #F0C4C4;color:#9E1F1F;
  font-size:12.5px;padding:9px 14px;text-align:center}
.cola b{color:#7A1616}
.cola u{cursor:pointer;margin-left:6px;font-weight:700}
.modo{position:relative;z-index:1;background:#FFF4DC;border-bottom:1px solid #E7CE94;color:#7A5200;font-size:12.5px;padding:8px 14px;text-align:center}
.modo b{color:#5C3D00}

.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,37,64,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:120}
.dlg{background:#fff;border-radius:14px;padding:17px;max-width:340px;width:100%;box-shadow:var(--sh)}
.dlg p{margin:0 0 14px;font-size:15px}
.dlg .par{display:flex;gap:8px}
.dlg button{margin:0;flex:1}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 17px;border-radius:99px;font-size:14px;z-index:99;box-shadow:var(--sh);max-width:88%;text-align:center}

.bara{height:10px;background:#E2E9F0;border-radius:99px;overflow:hidden;margin-top:6px;box-shadow:inset 0 1px 2px rgba(10,37,64,.16)}
.bara i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,#2A73C8,#0B4EA2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi>div{background:linear-gradient(160deg,#FFFFFF,var(--acbg,#EAF2FC));border:1px solid #D3DEE8;border-radius:12px;padding:13px;
  box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(10,37,64,.07)}
.kpi b{display:block;font:800 23px/1.1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--sumi)}
.kpi small{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.07em}

.emo{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.emo .e{border:1px solid #CDD9E3;border-radius:11px;padding:10px 4px;text-align:center;cursor:pointer;font-size:11.5px;line-height:1.2;
  background:linear-gradient(180deg,#FFFFFF,#F3F7FB);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(10,37,64,.07);transition:all .13s}
.emo .e:hover{transform:translateY(-1px)}
.emo .e i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}
.emo .e.on{border-color:var(--sumi);color:#0A3E80;font-weight:700;background:linear-gradient(180deg,#F0F6FE,#DAE7F9);
  box-shadow:inset 0 0 0 1px rgba(11,78,162,.5),inset 0 1px 0 #fff,0 3px 8px rgba(11,78,162,.18)}


/* ================= SPLASH Y PORTADA ================= */
.cover{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;z-index:200;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;
  color:#fff;background:radial-gradient(120% 90% at 50% 0%,#0F5FBE 0%,#0B3A73 45%,#071B2E 100%);
  transition:opacity .45s ease, visibility .45s}
.cover.off{opacity:0;visibility:hidden;pointer-events:none}
.cover .eng{width:132px;height:132px;margin-bottom:26px;position:relative}
.cover .eng svg{position:absolute;inset:0;width:100%;height:100%;
  fill:none;stroke:rgba(255,255,255,.92);stroke-width:2.6;stroke-linejoin:round}
.cover .eng svg.g2{width:52%;height:52%;left:auto;right:-12%;top:auto;bottom:-8%;
  stroke:var(--cian);opacity:.9;animation:giro-i 14s linear infinite}
.cover .eng svg.g1{animation:giro 22s linear infinite}
@keyframes giro-i{to{transform:rotate(-360deg)}}
.cover h1{font:800 34px/1.05 var(--f-disp);letter-spacing:-.02em;margin:0}
.cover .sub{font:600 11px/1.4 var(--f-disp);letter-spacing:.22em;text-transform:uppercase;
  color:#9EC3E8;margin-top:12px}
.cover .rule{width:52px;height:3px;border-radius:2px;background:var(--cian);margin:18px auto}
.cover .pie{font-size:12.5px;color:#8FB2D2;margin-top:4px}
.cover .quien2{font-size:13.5px;color:#CFE1F1;margin-top:22px}
.cover .quien2 b{color:#fff}
.cover .quien2 u{color:#9EC3E8;cursor:pointer;margin-left:6px}
.cover .quien2 u:active{color:#fff}
.cover button{max-width:320px;margin-top:20px;letter-spacing:.06em;font-size:14.5px;background:linear-gradient(180deg,#fff,#E9F0F8);color:#0B3A73;
  box-shadow:inset 0 1px 0 #fff,0 8px 26px rgba(0,0,0,.3)}
.cover button.sec2{margin-top:11px;background:rgba(255,255,255,.10);color:#fff;
  border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.cover .admlink{margin-top:20px;font-size:12px;letter-spacing:.14em;color:#7FA4C8;cursor:pointer;
  letter-spacing:.06em;padding:8px 14px;border-radius:8px}
.cover .admlink:active{color:#CFE1F1}
.cover .franja{position:absolute;top:0;left:0;right:0;height:10px;
  background:repeating-linear-gradient(135deg,#C62828 0 13px,#FFFFFF 13px 26px);opacity:.95}
.cover .franja.b{top:auto;bottom:0}
@media (prefers-reduced-motion:reduce){.cover .eng svg{animation:none}}

.vels{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.vbox{background:linear-gradient(180deg,#FFFFFF,#F3F7FB);border:1px solid #D3DEE8;border-radius:13px;padding:12px 10px 13px;text-align:center;
  box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(10,37,64,.08)}
.vel{width:100%;height:auto;display:block}
.vval{font:800 24px/1 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:-6px}
.vtit{font:600 10.5px/1.3 var(--f-disp);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.rbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.ros{width:150px;height:150px;flex:none;filter:drop-shadow(0 3px 8px rgba(10,37,64,.14))}
.leg{flex:1;min-width:160px;font-size:13.5px}
.leg>div{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #EDF2F7}
.leg>div:last-child{border-bottom:0}
.leg .pt{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:6px;height:168px;padding-top:6px;overflow-x:auto}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.cv{font:700 11px/1 var(--f-disp);color:var(--ink-2);margin-bottom:5px;font-variant-numeric:tabular-nums}
.cb{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;min-height:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 5px rgba(10,37,64,.16)}
.cl{font-size:10px;color:var(--ink-3);margin-top:7px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ================= PANEL LATERAL ================= */
#lateral{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:150;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0A2540 0%,#0B3358 60%,#0A2A48 100%);color:#fff;
  box-shadow:4px 0 26px rgba(10,37,64,.28);transform:translateX(-100%);transition:transform .26s ease;
  overflow-y:auto;overscroll-behavior:contain}
#lateral.open{transform:none}
.lat-h{padding:16px 16px 13px;border-bottom:1px solid rgba(255,255,255,.12);position:relative}
.lat-h .t{font:800 17px/1.1 var(--f-disp)}
